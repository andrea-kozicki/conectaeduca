name: GA06 Ferret cutover script syntax
on:
  pull_request:
    paths:
      - 'ops/pa07/**'
      - '.github/workflows/ga06-cutover-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Bash syntax only (no VM, Docker or sudo)
        shell: bash
        run: |
          bash -n ops/pa07/ce_ga06_cut01.sh
          echo "GA06_CUTOVER_BASH_SYNTAX=PASS"
