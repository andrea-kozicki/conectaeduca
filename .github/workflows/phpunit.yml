name: PHPUnit Security Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, openssl, pdo, pdo_mysql, curl, ctype, filter, hash, iconv
          coverage: none

      - name: Validate composer files
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find src public api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: List PHPUnit tests
        run: vendor/bin/phpunit --list-tests
        
      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox