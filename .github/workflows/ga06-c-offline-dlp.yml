name: GA06 C Offline DLP
on:
  pull_request:
    paths:
      - 'scripts/dlp/sanitizar_ferret.py'
      - 'scripts/dlp/processar_inbox_ferret.sh'
      - 'tests/python/test_ferret_sanitizer_ga06.py'
      - '.github/workflows/ga06-c-offline-dlp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ga06-offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA pinned
      - name: Run synthetic Python and Bash cleanup tests (no Docker)
        run: |
          python3 -m unittest discover -s tests/python -p 'test_ferret_sanitizer_ga06.py' -v
