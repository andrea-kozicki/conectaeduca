name: Gitleaks Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail

          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"

          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"

          curl -fL --retry 3 --retry-delay 2             -o "${RUNNER_TEMP}/${asset}"             "${url}"

          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -

          tar -xzf "${RUNNER_TEMP}/${asset}"             -C "${RUNNER_TEMP}/gitleaks-bin"

          chmod 0755 "${RUNNER_TEMP}/gitleaks-bin/gitleaks"
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"

      - name: Run ConectaEduca Gitleaks gate
        shell: bash
        run: bash scripts/evidencias/checkpoint_gitleaks.sh
