name: Repository Static Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
      - chore/pente-fino-repositorio-20260918

permissions:
  contents: read

concurrency:
  group: repository-static-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax for tracked scripts
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"

            case "$first_line" in
              *bash*)
                if ! bash -n "$file"; then
                  echo "::error file=$file::bash -n failed"
                  failures=1