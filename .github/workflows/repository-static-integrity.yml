      - name: Python syntax and structural integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          from collections import Counter
          from pathlib import Path
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["git", "ls-files", "-z", "*.py"],
          )
          files = [
              Path(item.decode())
              for item in raw.split(b"\0")
              if item
          ]

          failures: list[str] = []

          def is_main_guard(node: ast.AST) -> bool:
              if not isinstance(node, ast.If):
                  return False
              test = node.test
              if not isinstance(test, ast.Compare):
                  return False
              if len(test.ops) != 1 or not isinstance(test.ops[0], ast.Eq):
                  return False
              if len(test.comparators) != 1:
                  return False

              left = test.left
              right = test.comparators[0]

              pairs = ((left, right), (right, left))
              for name_node, value_node in pairs:
                  if (
                      isinstance(name_node, ast.Name)
                      and name_node.id == "__name__"
                      and isinstance(value_node, ast.Constant)
                      and value_node.value == "__main__"
                  ):
                      return True
              return False

          for path in files:
              try:
                  source = path.read_text(encoding="utf-8")
                  tree = ast.parse(source, filename=str(path))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  failures.append(f"{path}: parse failed: {exc}")
                  continue

              top_level_names = [
                  node.name
                  for node in tree.body
                  if isinstance(
                      node,
                      (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef),
                  )
              ]
              duplicates = sorted(
                  name
                  for name, count in Counter(top_level_names).items()
                  if count > 1
              )
              if duplicates:
                  failures.append(
                      f"{path}: duplicate top-level definitions: "
                      + ", ".join(duplicates)
                  )

              main_guards = sum(
                  1
                  for node in tree.body
                  if is_main_guard(node)
              )
              if main_guards > 1:
                  failures.append(
                      f"{path}: multiple __main__ guards: {main_guards}"
                  )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(f"PYTHON_STATIC_INTEGRITY=PASS files={len(files)}")
          PY

