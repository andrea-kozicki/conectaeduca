name: Repository Static Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
      - chore/pente-fino-repositorio-20260918

permissions:
  contents: read

concurrency:
  group: repository-static-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax for tracked scripts
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"

            case "$first_line" in
              *bash*)
                if ! bash -n "$file"; then
                  echo "::error file=$file::bash -n failed"
                  failures=1
                fi
                ;;
              *)
                if ! sh -n "$file"; then
                  echo "::error file=$file::sh -n failed"
                  failures=1
                fi
                ;;
            esac
          done < <(git ls-files -z '*.sh')

          exit "$failures"

      - name: Executable mode for delivered shell tools
        shell: bash
        run: |
          set -euo pipefail
          required=(
            scripts/implantacao/preparar_bacula_fd_ubuntu.sh
            scripts/implantacao/reconciliar_wazuh_dashboard_acl.sh
            scripts/release/gerar_handoff.sh
            scripts/release/verificar_handoff.sh
          )

          for file in "${required[@]}"; do
            mode="$(git ls-files --stage -- "$file" | awk 'NR == 1 {print $1}')"
            if [[ "$mode" != "100755" ]]; then
              echo "::error file=$file::expected executable Git mode 100755, got ${mode:-missing}"
              exit 1
            fi
          done

          echo "DELIVERED_SCRIPT_MODES=PASS count=${#required[@]}"

      - name: Source-root mode guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              Path("scripts/implantacao/validar_wazuh_operacional.sh"): [
                  "rev-parse --show-toplevel",
                  'git_top_real" == "$root_real',
              ],
              Path("scripts/bootstrap/preparar_ferret.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_portabilidade_containers.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_openbao_bacula_readiness.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_yara_antiapt_readiness.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_twingate_readiness.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_twingate_operacional.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
          }

          forbidden = 'rev-parse --is-inside-work-tree'
          for path, needles in checks.items():
              text = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing source-root guard: {needle}")
              if forbidden in text:
                  raise SystemExit(f"{path}: ancestor-worktree predicate remains")

          ferret_text = Path("scripts/bootstrap/preparar_ferret.sh").read_text(encoding="utf-8")
          if '[[ -d "$ROOT/.git" ]]' in ferret_text:
              raise SystemExit("preparar_ferret.sh: linked-worktree regression guard failed")

          approle = Path("scripts/recuperacao/recuperar_approle_bacula_snapshot.py").read_text(encoding="utf-8")
          if "rev-parse" not in approle or "--show-toplevel" not in approle:
              raise SystemExit("recuperar_approle_bacula_snapshot.py: missing exact Git root guard")
          if '(REPO / ".git").is_dir()' in approle:
              raise SystemExit("recuperar_approle_bacula_snapshot.py: linked-worktree regression remains")

          print(f"SOURCE_ROOT_MODE_GUARDS=PASS files={len(checks) + 1}")
          PY

      - name: Static-analysis regression guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          storage_path = Path("deploy/interna/bacula/preparar_storage_emulado.py")
          storage_text = storage_path.read_text(encoding="utf-8")
          storage_tree = ast.parse(storage_text, filename=str(storage_path))

          if '"--bacula-dir"' in storage_text:
              raise SystemExit("Storage helper: untrusted --bacula-dir override reintroduced")

          trusted_base = 'base = Path(__file__).resolve().parent'
          if trusted_base not in storage_text:
              raise SystemExit("Storage helper: persistent env base is no longer package-anchored")

          audit_path = Path("scripts/observabilidade/sanitizar_openbao_audit.py")
          audit_text = audit_path.read_text(encoding="utf-8")
          audit_tree = ast.parse(audit_text, filename=str(audit_path))

          forbidden = {"text", "encoding", "errors"}
          violations = []
          for node in ast.walk(audit_tree):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func
              is_popen = (
                  isinstance(func, ast.Attribute)
                  and isinstance(func.value, ast.Name)
                  and func.value.id == "subprocess"
                  and func.attr == "Popen"
              )
              if not is_popen:
                  continue
              keys = {kw.arg for kw in node.keywords if kw.arg}
              bad = sorted(keys & forbidden)
              if bad:
                  violations.append(",".join(bad))

          if violations:
              raise SystemExit(
                  "OpenBao audit Popen compatibility kwargs reintroduced: "
                  + "; ".join(violations)
              )

          print("STATIC_ANALYSIS_REGRESSION_GUARDS=PASS")
          PY

      - name: Handoff smoke regression guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/release/smoke_handoff.sh")
          text = path.read_text(encoding="utf-8")

          required = [
              "sha256sum -c SHA256SUMS",
              'skip "fish ausente; validação sintática opcional pulada: $rel"',
              "SKIP=$((SKIP + 1))",
              "printf 'SKIP=%d\\n' \"$SKIP\"",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"{path}: missing smoke regression guard: {needle}")

          if 'fail "fish ausente para validar sintaxe: $rel"' in text:
              raise SystemExit(f"{path}: Fish absence still treated as FAIL")

          print("HANDOFF_SMOKE_REGRESSION_GUARDS=PASS")
          PY

      - name: Self-test — Wazuh Dashboard ACL reconciler
        shell: bash
        run: bash scripts/implantacao/reconciliar_wazuh_dashboard_acl.sh --self-test

      - name: Self-test — Bacula FD bootstrap guards
        shell: bash
        run: sudo bash scripts/implantacao/preparar_bacula_fd_ubuntu.sh --self-test

      - name: Python syntax and structural integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          from collections import Counter
          from pathlib import Path
          import subprocess
          import sys

          raw = subprocess.check_output(
              ["git", "ls-files", "-z", "*.py"],
          )
          files = [
              Path(item.decode())
              for item in raw.split(b"\0")
              if item
          ]

          failures: list[str] = []

          def is_main_guard(node: ast.AST) -> bool:
              if not isinstance(node, ast.If):
                  return False
              test = node.test
              if not isinstance(test, ast.Compare):
                  return False
              if len(test.ops) != 1 or not isinstance(test.ops[0], ast.Eq):
                  return False
              if len(test.comparators) != 1:
                  return False

              left = test.left
              right = test.comparators[0]

              pairs = ((left, right), (right, left))
              for name_node, value_node in pairs:
                  if (
                      isinstance(name_node, ast.Name)
                      and name_node.id == "__name__"
                      and isinstance(value_node, ast.Constant)
                      and value_node.value == "__main__"
                  ):
                      return True
              return False

          for path in files:
              try:
                  source = path.read_text(encoding="utf-8")
                  tree = ast.parse(source, filename=str(path))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  failures.append(f"{path}: parse failed: {exc}")
                  continue

              top_level_names = [
                  node.name
                  for node in tree.body
                  if isinstance(
                      node,
                      (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef),
                  )
              ]
              duplicates = sorted(
                  name
                  for name, count in Counter(top_level_names).items()
                  if count > 1
              )
              if duplicates:
                  failures.append(
                      f"{path}: duplicate top-level definitions: "
                      + ", ".join(duplicates)
                  )

              main_guards = sum(
                  1
                  for node in tree.body
                  if is_main_guard(node)
              )
              if main_guards > 1:
                  failures.append(
                      f"{path}: multiple __main__ guards: {main_guards}"
                  )

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(f"PYTHON_STATIC_INTEGRITY=PASS files={len(files)}")
          PY

      - name: Repository regression checkpoint
        shell: bash
        run: bash scripts/evidencias/checkpoint_correcoes_codex.sh

      - name: Validate relative Markdown links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import unquote

          root = Path.cwd().resolve()
          raw = subprocess.check_output(
              ["git", "ls-files", "-z", "*.md"],
          )
          files = [
              Path(item.decode())
              for item in raw.split(b"\x00")
              if item
          ]

          link_re = re.compile(r"!?\[[^]]*\]\(([^)]+)\)")
          failures: list[str] = []

          for path in files:
              text = path.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  target = target.strip().strip("<>")
                  if not target:
                      continue
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if any(ch in target for ch in "{}$"):
                      continue

                  target = target.split("#", 1)[0].split("?", 1)[0]
                  target = unquote(target)
                  if not target:
                      continue

                  if target.startswith("/"):
                      candidate = root / target.lstrip("/")
                  else:
                      candidate = (path.parent / target).resolve()

                  try:
                      candidate.relative_to(root)
                  except ValueError:
                      failures.append(
                          f"{path}: relative link escapes repository: {target}"
                      )
                      continue

                  if not candidate.exists():
                      failures.append(
                          f"{path}: broken relative link: {target}"
                      )

          if failures:
              for failure in sorted(set(failures)):
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(f"MARKDOWN_RELATIVE_LINKS=PASS files={len(files)}")
          PY

      - name: Validate tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          raw = subprocess.check_output(
              ["git", "ls-files", "-z", "*.json"],
          )
          files = [
              Path(item.decode())
              for item in raw.split(b"\0")
              if item
          ]

          failures: list[str] = []

          for path in files:
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(f"JSON_STATIC_INTEGRITY=PASS files={len(files)}")
          PY

      - name: Build and verify release handoffs
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/conectaeduca-handoffs"
          mkdir -p "$OUT"

          DMZ_BUNDLE="$(bash scripts/release/gerar_handoff.sh dmz "$OUT" HEAD)"
          INT_BUNDLE="$(bash scripts/release/gerar_handoff.sh interna "$OUT" HEAD)"

          bash scripts/release/verificar_handoff.sh "$DMZ_BUNDLE" dmz
          bash scripts/release/verificar_handoff.sh "$INT_BUNDLE" interna

          bash scripts/release/inventariar_handoff.sh \
            "$DMZ_BUNDLE" \
            "$INT_BUNDLE" \
            "$RUNNER_TEMP/conectaeduca-handoff-inventory.txt"

          grep -Fxq 'INVENTARIO_FINAL=APROVADO' \
            "$RUNNER_TEMP/conectaeduca-handoff-inventory.txt"

          DMZ_EXTRACT="$RUNNER_TEMP/smoke-dmz"
          INT_EXTRACT="$RUNNER_TEMP/smoke-interna"
          mkdir -p "$DMZ_EXTRACT" "$INT_EXTRACT"
          tar -xzf "$DMZ_BUNDLE" -C "$DMZ_EXTRACT"
          tar -xzf "$INT_BUNDLE" -C "$INT_EXTRACT"

          env -u PROJECT_ROOT \
            CONECTAEDUCA_SMOKE_OFFLINE=1 \
            bash "$DMZ_EXTRACT/conectaeduca-dmz/scripts/release/smoke_handoff.sh" dmz

          env -u PROJECT_ROOT \
            CONECTAEDUCA_SMOKE_OFFLINE=1 \
            bash "$INT_EXTRACT/conectaeduca-interna/scripts/release/smoke_handoff.sh" interna

          CORRUPT_EXTRACT="$RUNNER_TEMP/smoke-interna-corrupt"
          cp -a "$INT_EXTRACT/conectaeduca-interna" "$CORRUPT_EXTRACT"
          printf '\n# CI intentional checksum corruption\n' >> "$CORRUPT_EXTRACT/RELEASE-METADATA.txt"

          if env -u PROJECT_ROOT \
            CONECTAEDUCA_SMOKE_OFFLINE=1 \
            bash "$CORRUPT_EXTRACT/scripts/release/smoke_handoff.sh" interna
          then
            echo "::error::smoke aceitou handoff adulterado após geração do SHA256SUMS"
            exit 1
          fi
          echo "HANDOFF_SMOKE_CORRUPTION_REJECTED=PASS"

      - name: Install Fish syntax checker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish

      - name: Fish syntax for tracked scripts
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! fish --no-execute "$file"; then
              echo "::error file=$file::fish --no-execute failed"
              failures=1
            fi
          done < <(git ls-files -z '*.fish')
          echo "FISH_SYNTAX_FILES=$count"
          exit "$failures"

      - name: Repository hygiene invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          files = [
              Path(item.decode())
              for item in raw.split(b"\0")
              if item
          ]

          failures: list[str] = []

          for path in files:
              if not path.is_file():
                  continue

              if path.stat().st_size == 0 and path.name != ".gitkeep":
                  failures.append(f"{path}: tracked zero-byte file")

              if path.suffix in {".sh", ".py", ".fish"}:
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  dangerous = [
                      (
                          re.compile(r"\bsudo\s+(?:-s|-i|su\b)"),
                          "persistent root shell pattern",
                      ),
                      (
                          re.compile(r"\bchmod\s+(?:777|0777)\b"),
                          "world-writable chmod",
                      ),
                      (
                          re.compile(
                              r"\b(?:curl|wget)\b[^\n|]*\|\s*"
                              r"(?:sudo\s+)?(?:sh|bash)\b"
                          ),
                          "download piped directly to shell",
                      ),
                  ]

                  for pattern, label in dangerous:
                      if pattern.search(text):
                          failures.append(f"{path}: {label}")

          workflow_files = [
              path
              for path in files
              if path.parts[:2] == (".github", "workflows")
              and path.suffix in {".yml", ".yaml"}
          ]

          action_re = re.compile(
              r"^\s*-?\s*uses:\s*([^#\s]+)",
              re.MULTILINE,
          )

          for path in workflow_files:
              text = path.read_text(encoding="utf-8")

              floating_runner_re = re.compile(
                  r"^\s*runs-on:\s*ubuntu-latest\s*$",
                  re.MULTILINE,
              )
              if not floating_runner_re.search("    runs-on: ubuntu-latest"):
                  failures.append(
                      f"{path}: floating runner detector self-test failed"
                  )
              if floating_runner_re.search("    runs-on: ubuntu-24.04"):
                  failures.append(
                      f"{path}: pinned runner detector self-test failed"
                  )
              if floating_runner_re.search(text):
                  failures.append(
                      f"{path}: floating runner ubuntu-latest"
                  )

              for match in action_re.finditer(text):
                  value = match.group(1)
                  if value.startswith("./") or value.startswith("docker://"):
                      continue
                  if "@" not in value:
                      failures.append(
                          f"{path}: external action without ref: {value}"
                      )
                      continue
                  ref = value.rsplit("@", 1)[1]
                  if not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
                      failures.append(
                          f"{path}: external action not pinned to 40-char SHA: "
                          f"{value}"
                      )

          conflict_re = re.compile(
              r"^(?:<<<<<<< |=======\s*$|>>>>>>> )",
              re.MULTILINE,
          )
          text_suffixes = {
              ".md", ".txt", ".sh", ".py", ".php", ".json",
              ".yml", ".yaml", ".xml", ".conf", ".example",
          }

          for path in files:
              if path.suffix not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if conflict_re.search(text):
                  failures.append(f"{path}: merge-conflict marker")

          if failures:
              for failure in sorted(set(failures)):
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(
              "REPOSITORY_HYGIENE=PASS "
              f"tracked_files={len(files)} workflows={len(workflow_files)}"
          )
          PY