      - name: Fish syntax for tracked scripts
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! fish --no-execute "$file"; then
              echo "::error file=$file::fish --no-execute failed"
              failures=1
            fi
          done < <(git ls-files -z '*.fish')
          echo "FISH_SYNTAX_FILES=$count"
          exit "$failures"

      - name: Repository hygiene invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          raw = subprocess.check_output(["git", "ls-files", "-z"])
          files = [
              Path(item.decode())
              for item in raw.split(b"\0")
              if item
          ]

          failures: list[str] = []

          for path in files:
              if not path.is_file():
                  continue

              if path.stat().st_size == 0 and path.name != ".gitkeep":
                  failures.append(f"{path}: tracked zero-byte file")

              if path.suffix in {".sh", ".py", ".fish"}:
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

                  dangerous = [
                      (
                          re.compile(r"\bsudo\s+(?:-s|-i|su\b)"),
                          "persistent root shell pattern",
                      ),
                      (
                          re.compile(r"\bchmod\s+(?:777|0777)\b"),
                          "world-writable chmod",
                      ),
                      (
                          re.compile(
                              r"\b(?:curl|wget)\b[^\n|]*\|\s*"
                              r"(?:sudo\s+)?(?:sh|bash)\b"
                          ),
                          "download piped directly to shell",
                      ),
                  ]

                  for pattern, label in dangerous:
                      if pattern.search(text):
                          failures.append(f"{path}: {label}")

          workflow_files = [
              path
              for path in files
              if path.parts[:2] == (".github", "workflows")
              and path.suffix in {".yml", ".yaml"}
          ]

          action_re = re.compile(
              r"^\s*-?\s*uses:\s*([^#\s]+)",
              re.MULTILINE,
          )

          for path in workflow_files:
              text = path.read_text(encoding="utf-8")

              floating_runner_re = re.compile(
                  r"^\s*runs-on:\s*ubuntu-latest\s*$",
                  re.MULTILINE,
              )
              if not floating_runner_re.search("    runs-on: ubuntu-latest"):
                  failures.append(
                      f"{path}: floating runner detector self-test failed"
                  )
              if floating_runner_re.search("    runs-on: ubuntu-24.04"):
                  failures.append(
                      f"{path}: pinned runner detector self-test failed"
                  )
              if floating_runner_re.search(text):
                  failures.append(
                      f"{path}: floating runner ubuntu-latest"
                  )

              for match in action_re.finditer(text):
                  value = match.group(1)
                  if value.startswith("./") or value.startswith("docker://"):
                      continue
                  if "@" not in value:
                      failures.append(
                          f"{path}: external action without ref: {value}"
                      )
                      continue
                  ref = value.rsplit("@", 1)[1]
                  if not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
                      failures.append(
                          f"{path}: external action not pinned to 40-char SHA: "
                          f"{value}"
                      )

          conflict_re = re.compile(
              r"^(?:<<<<<<< |=======\s*$|>>>>>>> )",
              re.MULTILINE,
          )
          text_suffixes = {
              ".md", ".txt", ".sh", ".py", ".php", ".json",
              ".yml", ".yaml", ".xml", ".conf", ".example",
          }

          for path in files:
              if path.suffix not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if conflict_re.search(text):
                  failures.append(f"{path}: merge-conflict marker")

          if failures:
              for failure in sorted(set(failures)):
                  print(f"::error::{failure}")
              raise SystemExit(1)

          print(
              "REPOSITORY_HYGIENE=PASS "
              f"tracked_files={len(files)} workflows={len(workflow_files)}"
          )
          PY