name: Repository Static Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
      - 'chore/pente-fino-*'

permissions:
  contents: read

concurrency:
  group: repository-static-integrity-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax for tracked scripts
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"

            case "$first_line" in
              *bash*)
                if ! bash -n "$file"; then
                  echo "::error file=$file::bash -n failed"
                  failures=1
                fi
                ;;
              *)
                if ! sh -n "$file"; then
                  echo "::error file=$file::sh -n failed"
                  failures=1
                fi
                ;;
            esac
          done < <(git ls-files -z '*.sh')

          exit "$failures"

      - name: Executable mode for delivered shell tools
        shell: bash
        run: |
          set -euo pipefail
          required=(
            scripts/implantacao/preparar_bacula_fd_ubuntu.sh
            scripts/implantacao/reconciliar_wazuh_dashboard_acl.sh
            scripts/release/gerar_handoff.sh
            scripts/release/verificar_handoff.sh
          )

          for file in "${required[@]}"; do
            mode="$(git ls-files --stage -- "$file" | awk 'NR == 1 {print $1}')"
            if [[ "$mode" != "100755" ]]; then
              echo "::error file=$file::expected executable Git mode 100755, got ${mode:-missing}"
              exit 1
            fi
          done

          echo "DELIVERED_SCRIPT_MODES=PASS count=${#required[@]}"

      - name: Source-root mode guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              Path("scripts/implantacao/validar_wazuh_operacional.sh"): [
                  "rev-parse --show-toplevel",
                  'git_top_real" == "$root_real',
              ],
              Path("scripts/bootstrap/preparar_ferret.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_portabilidade_containers.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_openbao_bacula_readiness.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_yara_antiapt_readiness.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_twingate_readiness.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
              Path("scripts/evidencias/checkpoint_twingate_operacional.sh"): [
                  "rev-parse --show-toplevel",
                  'GIT_TOP_REAL" == "$ROOT_REAL',
              ],
          }

          forbidden = 'rev-parse --is-inside-work-tree'
          for path, needles in checks.items():
              text = path.read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing source-root guard: {needle}")
              if forbidden in text:
                  raise SystemExit(f"{path}: ancestor-worktree predicate remains")

          ferret_text = Path("scripts/bootstrap/preparar_ferret.sh").read_text(encoding="utf-8")
          if '[[ -d "$ROOT/.git" ]]' in ferret_text:
              raise SystemExit("preparar_ferret.sh: linked-worktree regression guard failed")

          approle = Path("scripts/recuperacao/recuperar_approle_bacula_snapshot.py").read_text(encoding="utf-8")
          if "rev-parse" not in approle or "--show-toplevel" not in approle:
              raise SystemExit("recuperar_approle_bacula_snapshot.py: missing exact Git root guard")
          if '(REPO / ".git").is_dir()' in approle:
              raise SystemExit("recuperar_approle_bacula_snapshot.py: linked-worktree regression remains")
          if "PROJECT_ROOT" in approle:
              raise SystemExit(
                  "recuperar_approle_bacula_snapshot.py: environment-controlled project root regression"
              )

          bacularis_precheck = Path(
              "scripts/evidencias/gui01_bacularis_precheck.py"
          ).read_text(encoding="utf-8")
          if "--evidence-dir" in bacularis_precheck:
              raise SystemExit(
                  "gui01_bacularis_precheck.py: arbitrary evidence-dir regression"
              )
          if "write_evidence(Path.home())" not in bacularis_precheck:
              raise SystemExit(
                  "gui01_bacularis_precheck.py: fixed HOME evidence sink missing"
              )

          print(f"SOURCE_ROOT_MODE_GUARDS=PASS files={len(checks) + 2}")
          PY

      - name: Static-analysis regression guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          storage_path = Path("deploy/interna/bacula/preparar_storage_emulado.py")
          storage_text = storage_path.read_text(encoding="utf-8")
          storage_tree = ast.parse(storage_text, filename=str(storage_path))

          if '"--bacula-dir"' in storage_text:
              raise SystemExit("Storage helper: untrusted --bacula-dir override reintroduced")

          trusted_base = 'base = Path(__file__).resolve().parent'
          if trusted_base not in storage_text:
              raise SystemExit("Storage helper: persistent env base is no longer package-anchored")

          audit_path = Path("scripts/observabilidade/sanitizar_openbao_audit.py")
          audit_text = audit_path.read_text(encoding="utf-8")
          audit_tree = ast.parse(audit_text, filename=str(audit_path))

          forbidden = {"text", "encoding", "errors"}
          violations = []
          for node in ast.walk(audit_tree):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func
              is_popen = (
                  isinstance(func, ast.Attribute)
                  and isinstance(func.value, ast.Name)
                  and func.value.id == "subprocess"
                  and func.attr == "Popen"
              )
              if not is_popen:
                  continue
              keys = {kw.arg for kw in node.keywords if kw.arg}
              bad = sorted(keys & forbidden)
              if bad:
                  violations.append(",".join(bad))

          if violations:
              raise SystemExit(
                  "OpenBao audit Popen compatibility kwargs reintroduced: "
                  + "; ".join(violations)
              )

          readiness_path = Path("scripts/evidencias/pentest_no_sudo_readiness.py")
          readiness_text = readiness_path.read_text(encoding="utf-8")
          for needle in (
              "=== G1 CLIENT TOOLING ===",
              "=== G2 S10 FIM DROP-ZONE ===",
              "=== G3 S11/S13 FERRET DROP-ZONE ===",
              "method=shellless",
              "FERRET_RUNTIME_UID_GID_1000",
              "PENTEST_NO_SUDO_READY=",
          ):
              if needle not in readiness_text:
                  raise SystemExit(
                      f"{readiness_path}: zero-sudo readiness regression: {needle}"
                  )
          if "present={1 if out.strip() else 0}" in readiness_text:
              raise SystemExit(
                  f"{readiness_path}: legacy shell-failure-as-present detector reintroduced"
              )
          if 'if rc == 0 and "ep126" in HOST.lower()' in readiness_text:
              raise SystemExit(
                  f"{readiness_path}: legacy hostname gate reintroduced in loopback checks"
              )
          forbidden_direct_path_checks = (
              "FERRET_RUNTIME.is_dir()",
              "FERRET_INBOX.is_dir()",
              "FERRET_SUBMIT.is_file()",
              "protected.is_dir()",
              "FIM_LAB.is_dir()",
              "item.is_file()",
          )
          for forbidden_call in forbidden_direct_path_checks:
              if forbidden_call in readiness_text:
                  raise SystemExit(
                      f"{readiness_path}: direct path predicate can suppress/raise permission errors: "
                      + forbidden_call
                  )

          readiness_tree = ast.parse(readiness_text, filename=str(readiness_path))
          readiness_functions = {
              node.name: node
              for node in readiness_tree.body
              if isinstance(node, ast.FunctionDef)
          }
          for helper_name in ("safe_is_dir", "safe_is_file"):
              helper = readiness_functions.get(helper_name)
              if helper is None:
                  raise SystemExit(f"{readiness_path}: missing {helper_name}")
              has_stat_call = any(
                  isinstance(node, ast.Call)
                  and isinstance(node.func, ast.Attribute)
                  and node.func.attr == "stat"
                  for node in ast.walk(helper)
              )
              has_oserror_handler = any(
                  isinstance(node, ast.ExceptHandler)
                  and isinstance(node.type, ast.Name)
                  and node.type.id == "OSError"
                  for node in ast.walk(helper)
              )
              has_notfound_handler = any(
                  isinstance(node, ast.ExceptHandler)
                  and isinstance(node.type, ast.Name)
                  and node.type.id == "FileNotFoundError"
                  for node in ast.walk(helper)
              )
              suppressed_predicates = [
                  node.func.attr
                  for node in ast.walk(helper)
                  if isinstance(node, ast.Call)
                  and isinstance(node.func, ast.Attribute)
                  and node.func.attr in {"is_dir", "is_file"}
              ]
              if (
                  not has_stat_call
                  or not has_notfound_handler
                  or not has_oserror_handler
                  or suppressed_predicates
              ):
                  raise SystemExit(
                      f"{readiness_path}: {helper_name} must use stat(), "
                      "FileNotFoundError and OSError without Path.is_dir/is_file; "
                      f"suppressed={suppressed_predicates}"
                  )
          if 'os.environ.get("PROJECT_ROOT"' in readiness_text:
              raise SystemExit(
                  f"{readiness_path}: user-controlled PROJECT_ROOT override reintroduced"
              )
          if 'PROJECT_ROOT = Path("/opt/conectaeduca")' not in readiness_text:
              raise SystemExit(
                  f"{readiness_path}: canonical project root pin missing"
              )
          for needle in (
              'if HOST_ROLE == "internal":',
              'fail("ss -ltn indisponivel; nao e seguro pular endpoints internos")',
              'G1 MariaDB possui cliente CLI ou phpMyAdmin HTTPS como alternativa',
              'acl_entry = line.split("#", 1)[0].rstrip()',
              'parts = acl_entry.split(":", 2)',
              'def has_default_acl(path: Path) -> bool | None:',
              'fim_ok = fim_perms == {"w", "x"}',
              'def safe_is_dir(path: Path) -> tuple[bool, str | None]:',
              'def safe_is_file(path: Path) -> tuple[bool, str | None]:',
              'except FileNotFoundError:',
              'return stat.S_ISDIR(st.st_mode), None',
              'return stat.S_ISREG(st.st_mode), None',
              'FIM_LAB_INSPECTION=BLOCK|',
              'FERRET_RUNTIME_INSPECTION=BLOCK|',
              'bloqueio fail-closed sem traceback',
              'FERRET_PROTECTED_INSPECTION=',
              'no_default = default_acl is False',
          ):
              if needle not in readiness_text:
                  raise SystemExit(
                      f"{readiness_path}: canonical internal/ACL gate missing: {needle}"
                  )

          commands_text = Path(
              "docs/seguranca/PENTEST-COMANDOS-S01-S13.md"
          ).read_text(encoding="utf-8")
          for needle in (
              'FIM_TEST_FILE="$REPO/deploy/interna/pentest-fim-lab.tmp/arquivo-monitorado.txt"',
              'DLP_SUBMIT="$REPO/scripts/dlp/submeter_ferret_pentest.py"',
              'python3 "$DLP_SUBMIT" "$FILE"',
          ):
              if needle not in commands_text:
                  raise SystemExit(
                      "PENTEST-COMANDOS-S01-S13.md: canonical low-privilege path missing: "
                      + needle
                  )
          if 'DLP_INBOX="$HOME/conectaeduca-dlp-lab/inbox"' in commands_text:
              raise SystemExit(
                  "PENTEST-COMANDOS-S01-S13.md: direct legacy DLP inbox path reintroduced"
              )

          zero_path = Path("scripts/evidencias/pentest_sem_sudo_runtime_check.py")
          zero_text = zero_path.read_text(encoding="utf-8")
          required_zero = [
              'PRINCIPAL_UID_FILE = Path("/etc/conectaeduca/pentest-principal.uid")',
              "load_expected_principal_uid()",
              "os.geteuid() == expected_uid",
              "=== G2/G3 LOW-PRIVILEGE PATHS ===",
              "FERRET_INBOX_WRITE_EXECUTE",
              "FIM_TESTE_WRITE_EXECUTE",
          ]
          for needle in required_zero:
              if needle not in zero_text:
                  raise SystemExit(
                      f"{zero_path}: missing principal UID runtime guard: {needle}"
                  )
          if 'USER == "teste"' in zero_text or 'ACCOUNT == "teste"' in zero_text:
              raise SystemExit(
                  f"{zero_path}: hardcoded principal-name comparison reintroduced"
              )
          if "9098" in zero_text:
              raise SystemExit(
                  f"{zero_path}: legacy phpMyAdmin port 9098 reintroduced"
              )
          if '"ep126" in HOST.lower()' in zero_text:
              raise SystemExit(
                  f"{zero_path}: legacy hostname substring gate reintroduced"
              )
          if 'os.environ.get("PROJECT_ROOT"' in zero_text:
              raise SystemExit(
                  f"{zero_path}: user-controlled PROJECT_ROOT override reintroduced"
              )
          if 'PROJECT_ROOT = Path("/opt/conectaeduca")' not in zero_text:
              raise SystemExit(
                  f"{zero_path}: canonical project root pin missing"
              )
          for needle in (
              "exists = protected.is_dir()",
              "protected_ok = protected_ok and exists and not any_access",
              "FERRET_PROTECTED={protected}|exists=",
              "inbox_sticky = inbox_exists and bool(FERRET_INBOX.stat().st_mode & stat.S_ISVTX)",
              "FERRET_INBOX_STICKY_BIT=",
          ):
              if needle not in zero_text:
                  raise SystemExit(
                      f"{zero_path}: protected-path existence guard missing: {needle}"
                  )

          helper_path = Path(
              "scripts/implantacao/materializar_pentest_principal_uid.py"
          )
          helper_text = helper_path.read_text(encoding="utf-8")
          for needle in (
              'TARGET = Path("/etc/conectaeduca/pentest-principal.uid")',
              'parser.add_argument("--principal", required=True',
              "os.geteuid() != 0",
          ):
              if needle not in helper_text:
                  raise SystemExit(
                      f"{helper_path}: missing principal UID materialization guard: {needle}"
                  )

          ferret_submit = Path("scripts/dlp/submeter_ferret_pentest.py").read_text(
              encoding="utf-8"
          )
          for needle in (
              'os.environ.get("PROJECT_ROOT")',
              'Path(__file__).resolve().parents[2]',
              'default=None',
              'logical_name.startswith(".upload-")',
              'target_name = f"pentest-{secrets.token_hex(16)}.artifact"',
              'temp_name = f".upload-{os.getpid()}-{secrets.token_hex(16)}"',
              'src_dir_fd=inbox_fd',
              'dst_dir_fd=inbox_fd',
              'os.unlink(temp_name, dir_fd=inbox_fd)',
              'pass_fds=(dir_fd,)',
              'CALLER_NAME_USED_AS_PATH=NO',
              'BUNDLE_RELATIVE_DEFAULT=YES',
          ):
              if needle not in ferret_submit:
                  raise SystemExit(
                      "submeter_ferret_pentest.py: portable/atomic/path-boundary guard missing: "
                      + needle
                  )
          for forbidden in (
              "target = inbox /",
              "temp = inbox /",
              "os.link(temp, target",
              "os.unlink(temp)",
          ):
              if forbidden in ferret_submit:
                  raise SystemExit(
                      "submeter_ferret_pentest.py: argv-derived mutating pathname regression: "
                      + forbidden
                  )
          if '/opt/conectaeduca/deploy/interna/ferret/.runtime/inbox' in ferret_submit:
              raise SystemExit(
                  "submeter_ferret_pentest.py: hard-coded /opt inbox regression"
              )

          ferret_snapshot = Path("scripts/dlp/snapshot_ferret_input.py").read_text(
              encoding="utf-8"
          )
          if "os.unlink(output)" in ferret_snapshot:
              raise SystemExit(
                  "snapshot_ferret_input.py: argv-derived cleanup pathname regression"
              )
          if "cleanup_one()/traps do processor" not in ferret_snapshot:
              raise SystemExit(
                  "snapshot_ferret_input.py: parent-owned cleanup contract missing"
              )

          ferret_bootstrap = Path("scripts/bootstrap/preparar_ferret.sh").read_text(
              encoding="utf-8"
          )
          for needle in (
              "for acl_tool in setfacl getfacl",
              "instale o pacote host 'acl'",
              "ACL_TOOLING=PASS",
          ):
              if needle not in ferret_bootstrap:
                  raise SystemExit(
                      "preparar_ferret.sh: ACL tooling preflight missing: " + needle
                  )
          first_setfacl = ferret_bootstrap.find("sudo setfacl")
          preflight = ferret_bootstrap.find("for acl_tool in setfacl getfacl")
          if first_setfacl < 0 or preflight < 0 or preflight > first_setfacl:
              raise SystemExit(
                  "preparar_ferret.sh: ACL preflight must run before first setfacl mutation"
              )

          ferret_processor = Path("scripts/dlp/processar_inbox_ferret.sh").read_text(
              encoding="utf-8"
          )
          ferret_retention = Path("scripts/dlp/limpar_retencao_ferret.sh").read_text(
              encoding="utf-8"
          )
          for label, text in (
              ("processor", ferret_processor),
              ("retention", ferret_retention),
          ):
              for needle in (
                  "FERRET_STALE_TEMP_MINUTES",
                  "'.snapshot-*'",
                  "'.upload-*'",
              ):
                  if needle not in text:
                      raise SystemExit(
                          f"Ferret {label}: stale-temp recovery guard missing: {needle}"
                      )

          appsec04_path = Path(
              "scripts/evidencias/appsec04_snyk_revalidation.py"
          )
          appsec04_text = appsec04_path.read_text(encoding="utf-8")
          for needle in (
              'TARGET = "scripts/evidencias/ops01_ep126_readonly.py"',
              'CANONICAL_REPO_SLUG = "andrea-kozicki/conectaeduca"',
              'CANONICAL_MAIN_URL = "https://github.com/andrea-kozicki/conectaeduca.git"',
              'canonical_origin_url(url: str)',
              'flags=re.IGNORECASE | re.ASCII',
              'isolated_git_env(',
              '"GIT_CONFIG_NOSYSTEM": "1"',
              '"GIT_CONFIG_GLOBAL": os.devnull',
              '"GIT_CONFIG_COUNT": "0"',
              '"GIT_TERMINAL_PROMPT": "0"',
              '"GIT_CONFIG_PARAMETERS":',
              '"GIT_CONFIG_KEY_0":',
              '"GIT_CONFIG_VALUE_0":',
              '"GIT_NO_REPLACE_OBJECTS": "1"',
              '"PATH": "/usr/bin:/bin:/usr/sbin:/sbin"',
              'TRUSTED_GIT = Path("/usr/bin/git")',
              "trusted_git_binary(",
              "TRUSTED_GIT_ROOT_CONTROLLED=PASS",
              "TRUSTED_SNYK_CANDIDATES",
              "trusted_snyk_command(",
              "TRUSTED_SNYK=PASS",
              "TRUSTED_SNYK_ROOT_CONTROLLED=PASS",
              'TRUSTED_SUDO = Path("/usr/bin/sudo")',
              "trusted_sudo_binary(",
              "isolated_sudo_env(",
              "TRUSTED_SNYK_LAUNCHER=",
              "TRUSTED_SNYK_ENTRY=",
              "BLOCK_GIT_BINARY",
              '"GIT_EXEC_PATH"',
              '"https_proxy"',
              '"HTTPS_PROXY"',
              '"ALL_PROXY"',
              '"GIT_SSL_NO_VERIFY"',
              '"GIT_SSL_CAINFO"',
              '"CURL_CA_BUNDLE"',
              '"SSL_CERT_FILE"',
              '"GIT_SSH_COMMAND"',
              '"GIT_ASKPASS"',
              '"refs/replace/"',
              "GIT_REPLACE_REFS_COUNT=",
              "GIT_REPLACE_REFS=",
              '"https://gıthub.com/andrea-kozicki/conectaeduca.git"',
              '"config",',
              '"--local",',
              '"--no-includes",',
              '"--get-all",',
              '"remote.origin.url",',
              "ORIGIN_RAW_URL_COUNT=",
              'canonical_remote_main_query()',
              "cwd = Path(git_bin).resolve().parent",
              'env["GIT_CEILING_DIRECTORIES"] = str(cwd)',
              "REMOTE_QUERY_GIT_CONFIG_ISOLATED=YES",
              "REMOTE_QUERY_CWD_ROOT_CONTROLLED=YES",
              "REMOTE_QUERY_LOCAL_CONFIG_DISCOVERY=BLOCKED_BY_ROOT_CWD",
              "REMOTE_QUERY_PROXY_ENV_SANITIZED=YES",
              "REMOTE_QUERY_TLS_OVERRIDE_ENV_SANITIZED=YES",
              "REMOTE_QUERY_HTTP_PROXY_FORCED_EMPTY=YES",
              "REMOTE_QUERY_TLS_VERIFY_FORCED=YES",
              "GIT_EXEC_ENV_ALLOWLISTED=YES",
              "RUNTIME_INJECTION_ENV_DROPPED=YES",
              "SNYK_EXEC_ENV_ALLOWLISTED=YES",
              '"http.proxy="',
              '"http.sslVerify=true"',
              "ORIGIN_CANONICAL=",
              '[*snyk_cmd, "code", "test", "--sarif", "--include-ignores"]',
              "snyk_auth_available(",
              "SNYK_AUTH_SOURCE=",
              "BLOCK_SNYK_AUTH",
              'SNYK_INCLUDE_IGNORES=YES',
              'payload.get("version") != "2.1.0"',
              "validate_sarif(payload)",
              'tool = run_item["tool"] if "tool" in run_item else None',
              'if not isinstance(tool, dict):',
              '{"tool": "Snyk Code", "results": []}',
              'if not safe_metadata_text(driver_name):',
              'invocations = run_item["invocations"] if "invocations" in run_item else []',
              'if "executionSuccessful" not in invocation:',
              '"invocations": [{}]',
              'if execution_successful is False:',
              '"executionSuccessful": False',
              'results = run_item["results"] if "results" in run_item else []',
              'rules = driver["rules"] if "rules" in driver else []',
              'for rule_idx, rule in enumerate(rules):',
              'if not isinstance(rule, dict):',
              'rule_id = rule.get("id")',
              '{"id": ""}',
              'locations = result["locations"] if "locations" in result else []',
              'if not isinstance(locations, list):',
              'if not isinstance(location, dict):',
              'if not isinstance(physical, dict):',
              'if not isinstance(artifact, dict):',
              'safe_metadata_text(value: Any)',
              'unicodedata.category(ch) not in {"Cc", "Cs", "Zl", "Zp"}',
              'if not safe_metadata_text(uri):',
              'bad_surrogate = chr(0xD800)',
              '"locations": ["not-an-object"]',
              '"artifactLocation": {"uri": 123}',
              '"results": None',
              '"rules": None',
              'scan_exit_clean = scan_rc == 0',
              'rule_index = result.get("ruleIndex")',
              "bad_rule_index",
              "RAW_SARIF_PERSISTED=NO",
              'branch == "main"',
              "head == remote_main",
              'git_bin, "-c", "core.fsmonitor=false", "status", "--porcelain", "--untracked-files=all"',
              "WORKTREE_STATUS_FSMONITOR_DISABLED=YES",
              'git_bin, "ls-files", "-v", "-z"',
              'git_bin, "ls-files", "-f", "-z"',
              "special_index_entries(",
              "raw.split(chr(0))",
              '"H normal.py" + chr(0) + "h assumed.py" + chr(0)',
              "INDEX_TRACKING_FLAGS=",
              "INDEX_FSMONITOR_FLAGS=",
              'materialize_git_snapshot(',
              '[git_bin, "archive", "--format=tar"',
              '[git_bin, "ls-tree", "-r", "-z", commit]',
              "SNYK_SCAN_INPUT=VERIFIED_GIT_COMMIT_SNAPSHOT",
              "SNYK_SNAPSHOT_MATERIALIZATION=PASS",
              "SNYK_SNAPSHOT_READ_ONLY=",
              "verify_materialized_snapshot(",
              "SNYK_SNAPSHOT_POSTSCAN_INTEGRITY=",
              "APPSEC04_SNYK_REVALIDATION=BLOCK_SNAPSHOT_CHANGED",
              "APPSEC05_TARGETS = {",
