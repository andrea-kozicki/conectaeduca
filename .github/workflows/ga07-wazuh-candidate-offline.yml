name: GA07 Wazuh Non-Installable Candidate Offline
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/release/ga07-wazuh-candidates/**'
      - 'tests/python/test_ga07_wazuh_candidate_offline.py'
      - '.github/workflows/ga07-wazuh-candidate-offline.yml'
  push:
    branches: [main]
    paths:
      - 'docs/release/ga07-wazuh-candidates/**'
      - 'tests/python/test_ga07_wazuh_candidate_offline.py'
      - '.github/workflows/ga07-wazuh-candidate-offline.yml'

permissions:
  contents: read

jobs:
  ga07-wazuh-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile tests/python/test_ga07_wazuh_candidate_offline.py
      - name: Validate synthetic Wazuh source contract
        run: python3 -m unittest discover -s tests/python -p 'test_ga07_wazuh_candidate_offline.py' -v
