name: GA08 PA02 Dual Socket Offline Contract

on:
  pull_request:
    paths:
      - '.github/workflows/ga08-pa02-dual-socket-offline.yml'
      - 'deploy/dmz/compose.ga08-*.candidate.yml'
      - 'deploy/dmz/ga08/**'
      - 'scripts/ga08-implantacao-controlada-ep125.sh'
      - 'scripts/ga08-preparar-sockets-ep125.sh'
      - 'scripts/ga08-preflight-env-runtime-ep125.py'
      - 'scripts/ga08-contexto-execucao-ep125.py'
      - 'scripts/ga08-rollback-controlado-ep125.sh'
      - 'scripts/ga08-change-control.py'
      - 'tests/python/test_ga08_change_control_offline.py'
      - 'tests/python/test_ga08_*socket_candidate_offline.py'
      - 'docs/release/GA08-17B-CHANGE-CONTROL-EP125-20261102.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate gated scripts syntax
        run: |
          bash -n scripts/ga08-implantacao-controlada-ep125.sh
          bash -n scripts/ga08-rollback-controlado-ep125.sh
          bash -n scripts/ga08-preparar-sockets-ep125.sh
          python3 -m py_compile scripts/ga08-change-control.py scripts/ga08-preflight-env-runtime-ep125.py scripts/ga08-contexto-execucao-ep125.py

      - name: Test first socket and network isolation
        run: python3 tests/python/test_ga08_socket_candidate_offline.py -q

      - name: Test second socket and deployment gate
        run: python3 tests/python/test_ga08_dual_socket_candidate_offline.py -q

      - name: Exercise protected cutover and rollback (offline mocks)
        run: python3 tests/python/test_ga08_change_control_offline.py -q

      - name: Assert live operations require operator, immutable baseline and no implicit changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wrappers = (
              Path('scripts/ga08-implantacao-controlada-ep125.sh').read_text(),
              Path('scripts/ga08-rollback-controlado-ep125.sh').read_text(),
          )
          engine = Path('scripts/ga08-change-control.py').read_text()
          assert all('ga08-change-control.py' in item for item in wrappers)
          assert all('docker compose up' not in item for item in wrappers)
          assert 'if not args.execute:' in engine
          assert 'GA08_ENABLE_LIVE_CHANGE' in engine
          assert 'verify_approvals' in engine
          assert 'snapshot_restore_confirmed_by_operator' in engine
          assert '"--no-deps", "--no-build", "--pull", "never"' in engine
          assert 'BASE_COUNTS = {"waf": 9, "nginx": 9, "php": 10}' in engine
          assert '"CUTOVER_STARTED_" + service' in engine
          assert '"ROLLBACK_STARTED_" + service' in engine
          assert not re.search(r'"down"|"prune"|--force-rm', engine)
          print('GA08_DEPLOY_GATE=FECHADO_POR_PADRAO')
          PY
