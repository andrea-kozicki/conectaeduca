name: PA02 HTTP bind single guard static
on:
  pull_request:
    paths:
      - 'ops/pa02/**'
      - '.github/workflows/pa02-http-rw-single-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax and no-cutover contract
        shell: bash
        run: |
          python3 -m py_compile ops/pa02/ce_pa02_rw01.py ops/pa02/ce_pa02_cut01.py ops/pa02/ce_pa02_rc01.py ops/pa02/ce_pa02_iso01.py ops/pa02/ce_pa02_iso02_diag.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/pa02/ce_pa02_rw01.py').read_text()
          for ok in ('BIND_HTTP_RW=PASS', 'BIND_HTTP_LIMPEZA=PASS',
                     'CE-PA02-RW01_CONCLUIDO', '"--network", "none"',
                     '"--read-only"', '"--cap-drop", "ALL"', '"--rm"'):
              assert ok in s, ok
          for forbidden in ('docker compose', '"up", "-d"', '"systemctl"', 'sudo -s', '"prune"'):
              assert forbidden not in s, forbidden
          print("PA02_RW01_STATIC=PASS")
          driver=Path('ops/pa02/ce_pa02_cut01.py').read_text()
          for mark in ('PA05_OVERLAY', 'MIN_SNAPSHOT',
                       'snapshot_includes_pa05', 'G0_SNAPSHOT_ANTERIOR_PA05',
                       'def do_rollback(', 'BASE + extra',
                       'BYPASS_TCP_NGINX_AINDA_ACESSIVEL',
                       'CE-PA02-CUT01_CONCLUIDO', 'CE-PA02-CUT01_PREPARACAO_CONCLUIDA'):
              assert mark in driver, mark
          for forbid in ('sudo -s', 'docker prune', 'docker down', 'git reset --hard'):
              assert forbid not in driver, forbid
          for mark in (
              'def verify_local_backup(', 'G0_PACOTE_LOCAL_3_IMAGENS_11_COMPOSE=VERIFICADO',
              '"local-service"', '"hypervisor-snapshot"',
              '"same_host_loss_risk_accepted"',
              '"volumes_database_secrets_excluded_accepted"',
              '"restore_not_tested_risk_accepted"',
              'G0_BACKUP_LOCAL_NAO_E_SNAPSHOT',
              'G0_SNAPSHOT_HIPERVISOR=NAO',
          ):
              assert mark in driver, mark
          func=driver.split("def socket_roots() -> None:",1)[1].split("def verify_unix_sockets()",1)[0]
          for must in ('running=current()', '"--network","none"', '"--read-only"', '"--user",f"{uid}:{gid}"',
                       'SOCKET_RESIDUAL_REQUER_REVISAO', 'SOCKET_SANDBOX_FALHOU'):
              assert must in func, must
          assert '(directory/sock).exists()' not in func
          assert '(directory/sock).is_symlink()' not in func
          print("PA02_SOCKET_ROOTS_UID_SANDBOX_STATIC=PASS")
          import ast
          parsed=ast.parse(driver)
          dry=next(x for x in parsed.body if isinstance(x,ast.FunctionDef) and x.name=="dry_run")
          calls={x.func.id for x in ast.walk(dry)
                 if isinstance(x,ast.Call) and isinstance(x.func,ast.Name)}
          for forbidden in ("up","deploy","do_rollback","write_json",
                            "fetch_assets","prepare","subprocess","gates"):
              assert forbidden not in calls, (forbidden,calls)
          for required in ("current","check_containers","new_environment",
                           "verify_local_backup","model","assert_config"):
              assert required in calls, (required,calls)
          assert 'parser.add_argument("--mode",choices=("prepare","dry-run","apply","rollback")' in driver
          assert "DRY_RUN_NAO_ACEITA_ACK" in driver
          assert "CE-PA02-DRY01_CONCLUIDO" in driver
          print("PA02_DRY01_SEM_MUTACAO_E_COM_CHECKS=PASS")
          print("PA02_CUT01_PA05_GUARDS_STATIC=PASS")
          rc=Path('ops/pa02/ce_pa02_rc01.py').read_text()
          for token in ('"docker", "image", "save"', 'PA05_OVERLAY', 'BACKUP_11_COMPOSE=PASS',
                        'MANIFEST_INTEGRIDADE=PASS', 'VOLUMES_E_BANCO_COPIADOS=NAO',
                        'RESTARTS_E_SERVICOS_MODIFICADOS=NAO', 'ESPACO_INSUFICIENTE_NAO_EXPORTAR'):
              assert token in rc, token
          for forbidden in ('"docker", "compose", "up"', '"docker", "volume", "rm"',
                            '"docker", "image", "prune"', 'sudo -s'):
              assert forbidden not in rc, forbidden
          print("PA02_RC01_LOCAL_BACKUP_STATIC=PASS")
          iso=Path('ops/pa02/ce_pa02_iso01.py').read_text()
          import ast
          tree=ast.parse(iso)
          fn=next(x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name=="isolated_smoke")
          assert 'docker", "run"' in iso
          for must in ('"--network", "none"', '"--read-only"', '"--cap-drop", "ALL"',
                       '"--entrypoint", "/bin/sh"', '"--rm"',
                       'ISO01_ROLLBACK_REAL_ENSAIADO=NAO',
                       'CE-PA02-ISO01_CONCLUIDO',
                       'inspect_tar_archive(archive, expected)'):
              assert must in iso, must
          for forbidden in ('"docker", "image", "load"', '"docker", "compose"',
                            '"docker", "restart"', '"docker", "image", "prune"'):
              assert forbidden not in iso, forbidden
          diagnostic=Path('ops/pa02/ce_pa02_iso02_diag.py').read_text()
          for expected in ('IMAGE_ID_RUNTIME_12=', 'CONFIG_SHA256_ARQUIVO_12=',
                           'CONFIG_SHA_VS_IMAGE_ID=', 'ARMAZENAMENTO_IMAGENS=',
                           'BACKUP_MODIFICADO=NAO','DOCKER_LOAD_SAVE_EXECUTADO=NAO',
                           'CE-PA02-ISO02_DIAGNOSTICO_CONCLUIDO'):
              assert expected in diagnostic, expected
          for forbidden in ('"docker", "run"', '"docker", "compose"',
                            '"docker", "image", "load"', '"docker", "image", "save"',
                            'os.remove', 'unlink(', 'rmtree('):
              assert forbidden not in diagnostic, forbidden
          print("PA02_ISO02_READONLY_DIAGNOSTIC_STATIC=PASS")
          print("PA02_ISO01_SANDBOX_STATIC=PASS")
          PY
      - name: Docker archive fixtures classic and OCI containerd raw/gzip
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import importlib.util
          import io
          import json
          import tarfile
          import tempfile
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("pa02_iso",Path("ops/pa02/ce_pa02_iso01.py"))
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          values, samples, members, roots, paths, configs={},{},[],{},{},{}
          sha=lambda x:hashlib.sha256(x).hexdigest()
          for n in ("php","nginx","waf"):
              ref="example/"+n+":safe"
              layerdata=b"test-layer-"+n.encode()
              packed=gzip.compress(layerdata,mtime=0) if n=="php" else layerdata
              diffid="sha256:"+sha(layerdata)
              layer="blobs/sha256/"+sha(packed) if n!="nginx" else n+"/layer.tar"
              data=json.dumps({
                  "architecture":"amd64","os":"linux","name":n,
                  "rootfs":{"type":"layers","diff_ids":[diffid]},
              }).encode()
              cfg=("blobs/sha256/"+sha(data)) if n!="nginx" else (sha(data)+".json")
              values[ref]="sha256:"+sha(("manifest-"+n).encode())
              roots[ref]=[diffid]
              members.append({"Config":cfg,"RepoTags":[ref],"Layers":[layer]})
              samples[cfg]=data
              samples[layer]=packed
              paths[n]=layer
              configs[n]=cfg
          samples["manifest.json"]=json.dumps(members).encode()
          mod.run=lambda args:json.dumps(roots[args[3]])
          def make_tar(path, data):
              with tarfile.open(path,"w:gz") as tar:
                  for name,blob in data.items():
                      item=tarfile.TarInfo(name)
                      item.size=len(blob)
                      tar.addfile(item,io.BytesIO(blob))
          def expect_error(path,data,error):
              make_tar(path,data)
              try:
                  mod.inspect_tar_archive(path,values)
              except mod.GateError as exc:
                  assert str(exc)==error, (str(exc),error)
              else:
                  raise AssertionError("corrupcao indevidamente aceita: "+error)
          with tempfile.TemporaryDirectory() as temp:
              path=Path(temp)/"images.tar.gz"
              make_tar(path,samples)
              mod.inspect_tar_archive(path,values)
              print("PA02_ISO01_CLASSIC_OCI_GZIP_MIX=PASS")
              altered=dict(samples)
              altered[paths["nginx"]]=b"adulterado"
              expect_error(path,altered,"ARQUIVO_LAYER_DIFFID_DIVERGENTE")
              print("PA02_ISO01_LAYER_DIFFID_FAIL_CLOSED=PASS")
              altered=dict(samples)
              altered[paths["php"]]=b"adulterado"
              expect_error(path,altered,"ARQUIVO_BLOB_OCI_SHA256_DIVERGENTE")
              print("PA02_ISO01_BLOB_OCI_FAIL_CLOSED=PASS")
              altered=dict(samples)
              altered[configs["nginx"]]=b'{"rootfs":{"diff_ids":[]}}'
              expect_error(path,altered,"ARQUIVO_CONFIG_NOME_SHA256_DIVERGENTE")
              print("PA02_ISO01_CONFIG_SHA_FAIL_CLOSED=PASS")
          PY
      - name: Unit test Compose secrets vs volumes and partial context guard
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import importlib.util
          from pathlib import Path
          p=Path("ops/pa02/ce_pa02_cut01.py")
          spec=importlib.util.spec_from_file_location("pa02",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          expected={"conectaeduca_db_password","conectaeduca_db_tls_ca",
                    "conectaeduca_private_key","conectaeduca_public_key"}
          php={"image":mod.PA05_IMAGE,"secrets":[
                {"source":name,"target":"/run/secrets/"+name}
                for name in expected],
               "environment":{
                 "DB_PASS_FILE":"/run/secrets/conectaeduca_db_password",
                 "DB_SSL_CA":"/run/secrets/conectaeduca_db_tls_ca",
                 "PRIVATE_KEY_PATH":"/run/secrets/conectaeduca_private_key",
                 "PUBLIC_KEY_PATH":"/run/secrets/conectaeduca_public_key",
               },
               "volumes":[{"type":"bind","source":"/var/log/conectaeduca/php-audit",
                           "target":"/var/www/conectaeduca/storage/logs",
                           "read_only":False}],
               "networks":{"frontend":None},"expose":["9000"],
               "read_only":True}
          base={"secrets":{name:{"file":"/restricted/"+name} for name in expected},
                "services":{"php":php,
                  "nginx":{"image":"nginx:tag","networks":{"frontend":None},
                           "read_only":True},
                  "waf":{"image":"waf:tag","networks":{"frontend":None},
                         "read_only":True,"secrets":[]}}}
          candidate=copy.deepcopy(base)
          candidate["services"]["php"].update(expose=[],networks={"php_egress":None})
          candidate["services"]["nginx"].update(
              networks={"waf_backend":None},
              expose=[],ports=[],
              tmpfs=["/run:rw,nosuid,nodev,noexec,size=4m"])
          candidate["services"]["waf"].update(
              networks={"waf_backend":None},
              environment={"BACKEND":"http://unix:/run/conectaeduca-http/nginx.sock:"})
          mod.assert_config(base,candidate)
          print("PA02_COMPOSE_SECRETS_NAO_SAO_VOLUMES=PASS")
          broken=copy.deepcopy(candidate)
          broken["services"]["php"]["secrets"]=[]
          try:
              mod.assert_config(base,broken)
          except mod.GateError as exc:
              assert str(exc)=="SECRETS_SERVICO_ALTERADOS_php"
          else:
              raise AssertionError("alteracao de secrets indevidamente aceita")
          broken=copy.deepcopy(candidate)
          broken["services"]["php"]["volumes"]=[]
          try:
              mod.assert_config(base,broken)
          except mod.GateError as exc:
              assert str(exc)=="AUDITORIA_BIND_AUSENTE_CANDIDATO"
          else:
              raise AssertionError("retirada audit bind indevidamente aceita")
          print("PA02_COMPOSE_FAIL_CLOSED=PASS")
          PY
