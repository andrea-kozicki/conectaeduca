name: PA02 HTTP bind single guard static
on:
  pull_request:
    paths:
      - 'ops/pa02/**'
      - '.github/workflows/pa02-http-rw-single-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax and no-cutover contract
        shell: bash
        run: |
          python3 -m py_compile ops/pa02/ce_pa02_rw01.py ops/pa02/ce_pa02_cut01.py ops/pa02/ce_pa02_rc01.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/pa02/ce_pa02_rw01.py').read_text()
          for ok in ('BIND_HTTP_RW=PASS', 'BIND_HTTP_LIMPEZA=PASS',
                     'CE-PA02-RW01_CONCLUIDO', '"--network", "none"',
                     '"--read-only"', '"--cap-drop", "ALL"', '"--rm"'):
              assert ok in s, ok
          for forbidden in ('docker compose', '"up", "-d"', '"systemctl"', 'sudo -s', '"prune"'):
              assert forbidden not in s, forbidden
          print("PA02_RW01_STATIC=PASS")
          driver=Path('ops/pa02/ce_pa02_cut01.py').read_text()
          for mark in ('PA05_OVERLAY', 'MIN_SNAPSHOT',
                       'snapshot_includes_pa05', 'G0_SNAPSHOT_ANTERIOR_PA05',
                       'def do_rollback(', 'BASE + extra',
                       'BYPASS_TCP_NGINX_AINDA_ACESSIVEL',
                       'CE-PA02-CUT01_CONCLUIDO', 'CE-PA02-CUT01_PREPARACAO_CONCLUIDA'):
              assert mark in driver, mark
          for forbid in ('sudo -s', 'docker prune', 'docker down', 'git reset --hard'):
              assert forbid not in driver, forbid
          for mark in (
              'def verify_local_backup(', 'G0_PACOTE_LOCAL_3_IMAGENS_11_COMPOSE=VERIFICADO',
              '"local-service"', '"hypervisor-snapshot"',
              '"same_host_loss_risk_accepted"',
              '"volumes_database_secrets_excluded_accepted"',
              '"restore_not_tested_risk_accepted"',
              'G0_BACKUP_LOCAL_NAO_E_SNAPSHOT',
              'G0_SNAPSHOT_HIPERVISOR=NAO',
          ):
              assert mark in driver, mark
          func=driver.split("def socket_roots() -> None:",1)[1].split("def verify_unix_sockets()",1)[0]
          for must in ('running=current()', '"--network","none"', '"--read-only"', '"--user",f"{uid}:{gid}"',
                       'SOCKET_RESIDUAL_REQUER_REVISAO', 'SOCKET_SANDBOX_FALHOU'):
              assert must in func, must
          assert '(directory/sock).exists()' not in func
          assert '(directory/sock).is_symlink()' not in func
          print("PA02_SOCKET_ROOTS_UID_SANDBOX_STATIC=PASS")
          print("PA02_CUT01_PA05_GUARDS_STATIC=PASS")
          rc=Path('ops/pa02/ce_pa02_rc01.py').read_text()
          for token in ('"docker", "image", "save"', 'PA05_OVERLAY', 'BACKUP_11_COMPOSE=PASS',
                        'MANIFEST_INTEGRIDADE=PASS', 'VOLUMES_E_BANCO_COPIADOS=NAO',
                        'RESTARTS_E_SERVICOS_MODIFICADOS=NAO', 'ESPACO_INSUFICIENTE_NAO_EXPORTAR'):
              assert token in rc, token
          for forbidden in ('"docker", "compose", "up"', '"docker", "volume", "rm"',
                            '"docker", "image", "prune"', 'sudo -s'):
              assert forbidden not in rc, forbidden
          print("PA02_RC01_LOCAL_BACKUP_STATIC=PASS")
          PY
      - name: Unit test Compose secrets vs volumes and partial context guard
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import importlib.util
          from pathlib import Path
          p=Path("ops/pa02/ce_pa02_cut01.py")
          spec=importlib.util.spec_from_file_location("pa02",p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          expected={"conectaeduca_db_password","conectaeduca_db_tls_ca",
                    "conectaeduca_private_key","conectaeduca_public_key"}
          php={"image":mod.PA05_IMAGE,"secrets":[
                {"source":name,"target":"/run/secrets/"+name}
                for name in expected],
               "environment":{
                 "DB_PASS_FILE":"/run/secrets/conectaeduca_db_password",
                 "DB_SSL_CA":"/run/secrets/conectaeduca_db_tls_ca",
                 "PRIVATE_KEY_PATH":"/run/secrets/conectaeduca_private_key",
                 "PUBLIC_KEY_PATH":"/run/secrets/conectaeduca_public_key",
               },
               "volumes":[{"type":"bind","source":"/var/log/conectaeduca/php-audit",
                           "target":"/var/www/conectaeduca/storage/logs",
                           "read_only":False}],
               "networks":{"frontend":None},"expose":["9000"],
               "read_only":True}
          base={"secrets":{name:{"file":"/restricted/"+name} for name in expected},
                "services":{"php":php,
                  "nginx":{"image":"nginx:tag","networks":{"frontend":None},
                           "read_only":True},
                  "waf":{"image":"waf:tag","networks":{"frontend":None},
                         "read_only":True,"secrets":[]}}}
          candidate=copy.deepcopy(base)
          candidate["services"]["php"].update(expose=[],networks={"php_egress":None})
          candidate["services"]["nginx"].update(
              networks={"waf_backend":None},
              expose=[],ports=[],
              tmpfs=["/run:rw,nosuid,nodev,noexec,size=4m"])
          candidate["services"]["waf"].update(
              networks={"waf_backend":None},
              environment={"BACKEND":"http://unix:/run/conectaeduca-http/nginx.sock:"})
          mod.assert_config(base,candidate)
          print("PA02_COMPOSE_SECRETS_NAO_SAO_VOLUMES=PASS")
          broken=copy.deepcopy(candidate)
          broken["services"]["php"]["secrets"]=[]
          try:
              mod.assert_config(base,broken)
          except mod.GateError as exc:
              assert str(exc)=="SECRETS_SERVICO_ALTERADOS_php"
          else:
              raise AssertionError("alteracao de secrets indevidamente aceita")
          broken=copy.deepcopy(candidate)
          broken["services"]["php"]["volumes"]=[]
          try:
              mod.assert_config(base,broken)
          except mod.GateError as exc:
              assert str(exc)=="AUDITORIA_BIND_AUSENTE_CANDIDATO"
          else:
              raise AssertionError("retirada audit bind indevidamente aceita")
          print("PA02_COMPOSE_FAIL_CLOSED=PASS")
          PY
