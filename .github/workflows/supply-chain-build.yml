name: Supply Chain Build Gate

on:
  push:
    branches: [ main ]
    paths:
      - '.dockerignore'
      - 'composer.json'
      - 'composer.lock'
      - 'deploy/**/Dockerfile'
      - 'deploy/**/Dockerfile.*'
      - 'deploy/**/compose*.yml'
      - 'deploy/**/compose*.yaml'
      - 'scripts/build/**'
      - '.github/workflows/supply-chain-build.yml'
  pull_request:
    branches:
      - main
      - chore/pente-fino-fase2-reprodutibilidade-20260918
    paths:
      - '.dockerignore'
      - 'composer.json'
      - 'composer.lock'
      - 'deploy/**/Dockerfile'
      - 'deploy/**/Dockerfile.*'
      - 'deploy/**/compose*.yml'
      - 'deploy/**/compose*.yaml'
      - 'scripts/build/**'
      - '.github/workflows/supply-chain-build.yml'

permissions:
  contents: read

concurrency:
  group: supply-chain-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Supply chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build orchestrator plan
        shell: bash
        run: bash scripts/build/construir_imagens_locais.sh --alvo all --plan

      - name: Validate supply chain invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          failures: list[str] = []

          def fail(message: str) -> None:
              failures.append(message)

          dockerfiles = [
              Path(item.decode())
              for item in subprocess.check_output(
                  ["git", "ls-files", "-z", "Dockerfile", "**/Dockerfile", "**/Dockerfile.*"]
              ).split(b"\0")
              if item
          ]

          # Bases externas literais precisam de digest. Bases locais conectaeduca/*
          # são validadas pela receita/orquestrador do próprio projeto.
          for path in dockerfiles:
              text = path.read_text(encoding="utf-8")
              args: dict[str, str] = {}
              stages: set[str] = set()

              for raw in text.splitlines():
                  line = raw.strip()
                  m_arg = re.match(r"ARG\s+([A-Za-z_][A-Za-z0-9_]*)=(.+)$", line)
                  if m_arg:
                      args[m_arg.group(1)] = m_arg.group(2).strip()
                      continue

                  m_from = re.match(
                      r"FROM\s+([^\s]+)(?:\s+AS\s+([^\s]+))?",
                      line,
                      re.IGNORECASE,
                  )
                  if not m_from:
                      continue

                  ref = m_from.group(1)
                  alias = m_from.group(2)

                  if ref in stages:
                      if alias:
                          stages.add(alias)
                      continue

                  resolved = ref
                  if ref.startswith("${") and ref.endswith("}"):
                      name = ref[2:-1]
                      default = args.get(name)
                      if not default:
                          fail(f"{path}: FROM usa {ref} sem ARG default verificável")
                          if alias:
                              stages.add(alias)
                          continue
                      resolved = default

                  if not resolved.startswith("conectaeduca/") and "@sha256:" not in resolved:
                      fail(f"{path}: base externa sem digest: {resolved}")

                  if alias:
                      stages.add(alias)

          compose_files = [
              Path(item.decode())
              for item in subprocess.check_output(
                  ["git", "ls-files", "-z", "deploy/**/compose*.yml", "deploy/**/compose*.yaml"]
              ).split(b"\0")
              if item
          ]

          image_re = re.compile(r"^\s*image:\s*['\"]?([^'\"#\s]+)")
          for path in compose_files:
              for line_no, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = image_re.match(raw)
                  if not match:
                      continue
                  ref = match.group(1)

                  if ref.startswith("conectaeduca/"):
                      continue

                  if "${" in ref:
                      # Aceita apenas expressão cujo default já contenha digest.
                      if "@sha256:" not in ref:
                          fail(f"{path}:{line_no}: image parametrizada sem digest no default: {ref}")
                      continue

                  if "@sha256:" not in ref:
                      fail(f"{path}:{line_no}: image externa sem digest: {ref}")

          required_markers = {
              Path("deploy/dmz/nginx/Dockerfile"): (
                  "CONECTAEDUCA_SOURCE_COMMIT",
                  "org.opencontainers.image.revision",
                  "io.conectaeduca.build-policy",
                  "build-provenance.txt",
              ),
              Path("deploy/dmz/php/Dockerfile"): (
                  "CONECTAEDUCA_SOURCE_COMMIT",
                  "org.opencontainers.image.revision",
                  "io.conectaeduca.build-policy",
                  "build-packages.txt",
                  "build-provenance.txt",
              ),
              Path("deploy/dmz/waf/Dockerfile"): (
                  "CONECTAEDUCA_SOURCE_COMMIT",
                  "org.opencontainers.image.revision",
                  "io.conectaeduca.build-policy",
                  "build-packages.txt",
                  "build-provenance.txt",
              ),
              Path("deploy/interna/bacula/images/Dockerfile.vm"): (
                  "CONECTAEDUCA_SOURCE_COMMIT",
                  "org.opencontainers.image.revision",
                  "io.conectaeduca.build-policy",
                  "build-packages.txt",
                  "build-provenance.txt",
                  "BACULA_VERSION=15.0.3-3",
              ),
              Path("deploy/interna/bacula/pgbouncer/Dockerfile"): (
                  "CONECTAEDUCA_SOURCE_COMMIT",
                  "org.opencontainers.image.revision",
                  "io.conectaeduca.build-policy",
                  "build-packages.txt",
                  "build-provenance.txt",
                  "PGBOUNCER_UPSTREAM_VERSION=1.24.1",
                  "pgbouncer --version",
                  "parent-image-ref",
              ),
          }

          for path, markers in required_markers.items():
              if not path.is_file():
                  fail(f"{path}: Dockerfile obrigatório ausente")
                  continue
              text = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      fail(f"{path}: marcador de proveniência ausente: {marker}")

          dockerignore = Path(".dockerignore").read_text(encoding="utf-8")
          for pattern in (
              "**/.runtime/",
              "*.secret",
              "*.secrets",
              "*.credentials",
              "*.pem",
              "*.key",
              "*.p12",
              "*.pfx",
          ):
              if pattern not in dockerignore:
                  fail(f".dockerignore: padrão obrigatório ausente: {pattern}")

          orchestrator = Path("scripts/build/construir_imagens_locais.sh")
          if not orchestrator.is_file():
              fail("orquestrador oficial de build ausente")
          else:
              text = orchestrator.read_text(encoding="utf-8")
              for marker in (
                  "CONECTAEDUCA_SOURCE_COMMIT",
                  "parent-image-id",
                  "--plan",
                  "git status --porcelain=v1",
                  "PGBOUNCER_UPSTREAM_VERSION=1.24.1",
              ):
                  if marker not in text:
                      fail(f"orquestrador: marcador obrigatório ausente: {marker}")

          if failures:
              for item in sorted(set(failures)):
                  print(f"::error::{item}")
              raise SystemExit(1)

          print(
              "SUPPLY_CHAIN_POLICY=PASS "
              f"dockerfiles={len(dockerfiles)} compose_files={len(compose_files)}"
          )
          PY

  build-nginx:
    name: Build proof — Nginx DMZ
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: policy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Nginx image
        shell: bash
        run: |
          set -euo pipefail
          docker build             --build-arg "CONECTAEDUCA_SOURCE_COMMIT=$GITHUB_SHA"             -f deploy/dmz/nginx/Dockerfile             -t conectaeduca/nginx:supply-chain-ci             .

      - name: Verify Nginx provenance
        shell: bash
        run: |
          set -euo pipefail

          revision="$(docker image inspect             conectaeduca/nginx:supply-chain-ci             --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          policy="$(docker image inspect             conectaeduca/nginx:supply-chain-ci             --format '{{index .Config.Labels "io.conectaeduca.build-policy"}}')"
          image_id="$(docker image inspect             conectaeduca/nginx:supply-chain-ci             --format '{{.Id}}')"

          test "$revision" = "$GITHUB_SHA"
          test "$policy" = "base-digest"

          docker run --rm --entrypoint cat             conectaeduca/nginx:supply-chain-ci             /usr/share/conectaeduca/build-provenance.txt             | tee /tmp/nginx-build-provenance.txt

          grep -Fxq "source_commit=$GITHUB_SHA"             /tmp/nginx-build-provenance.txt
          grep -Fxq 'package_policy=base-image-only'             /tmp/nginx-build-provenance.txt

          echo "NGINX_SUPPLY_CHAIN_BUILD=PASS"
          echo "NGINX_IMAGE_ID=$image_id"

  build-bacula-pgbouncer:
    name: Build proof — Bacula → PgBouncer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: policy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Bacula Director
        shell: bash
        run: |
          set -euo pipefail
          docker build             --build-arg "CONECTAEDUCA_SOURCE_COMMIT=$GITHUB_SHA"             --target director             -f deploy/interna/bacula/images/Dockerfile.vm             -t conectaeduca/bacula-director:15.0.3             .

      - name: Build PgBouncer bridge
        shell: bash
        run: |
          set -euo pipefail

          director_id="$(docker image inspect             conectaeduca/bacula-director:15.0.3             --format '{{.Id}}')"

          docker build             --build-arg "CONECTAEDUCA_SOURCE_COMMIT=$GITHUB_SHA"             --build-arg "BACULA_BASE_IMAGE=conectaeduca/bacula-director:15.0.3"             --build-arg "PGBOUNCER_UPSTREAM_VERSION=1.24.1"             --label "io.conectaeduca.parent-image-id=$director_id"             -f deploy/interna/bacula/pgbouncer/Dockerfile             -t conectaeduca/pgbouncer:1.24.1-tls-bridge             .

      - name: Verify Bacula and PgBouncer provenance
        shell: bash
        run: |
          set -euo pipefail

          director_id="$(docker image inspect             conectaeduca/bacula-director:15.0.3             --format '{{.Id}}')"

          director_revision="$(docker image inspect             conectaeduca/bacula-director:15.0.3             --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$director_revision" = "$GITHUB_SHA"

          parent_id="$(docker image inspect             conectaeduca/pgbouncer:1.24.1-tls-bridge             --format '{{index .Config.Labels "io.conectaeduca.parent-image-id"}}')"
          pgb_revision="$(docker image inspect             conectaeduca/pgbouncer:1.24.1-tls-bridge             --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"

          test "$parent_id" = "$director_id"
          test "$pgb_revision" = "$GITHUB_SHA"

          version_out="$(docker run --rm --entrypoint pgbouncer             conectaeduca/pgbouncer:1.24.1-tls-bridge             --version 2>&1 | head -n1)"
          echo "PGBOUNCER_VERSION_OUTPUT=$version_out"
          grep -Eq '(^|[[:space:]])1\.24\.1([[:space:]]|$)' <<<"$version_out"

          docker run --rm --entrypoint cat             conectaeduca/pgbouncer:1.24.1-tls-bridge             /usr/share/conectaeduca/build-provenance.txt             | tee /tmp/pgbouncer-build-provenance.txt

          docker run --rm --entrypoint cat             conectaeduca/pgbouncer:1.24.1-tls-bridge             /usr/share/conectaeduca/pgbouncer-package-version.txt             | tee /tmp/pgbouncer-package-version.txt

          grep -Fxq "source_commit=$GITHUB_SHA"             /tmp/pgbouncer-build-provenance.txt
          grep -Fxq 'pgbouncer_upstream_version=1.24.1'             /tmp/pgbouncer-build-provenance.txt

          echo "BACULA_PGBOUNCER_SUPPLY_CHAIN_BUILD=PASS"
          echo "DIRECTOR_IMAGE_ID=$director_id"
          echo "PGBOUNCER_PARENT_IMAGE_ID=$parent_id"