name: PA07 Ferret launcher alignment syntax
on:
  pull_request:
    paths:
      - 'ops/pa07/ce_ga06_align01.py'
      - 'scripts/dlp/processar_inbox_ferret.sh'
      - 'scripts/dlp/processar_inbox_ferret.fish'
      - 'scripts/bootstrap/subir_ferret.fish'
      - '.github/workflows/pa07-compose-alignment-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check installer syntax and pinned reference
        shell: bash
        run: |
          python3 -m py_compile ops/pa07/ce_ga06_align01.py
          bash -n scripts/dlp/processar_inbox_ferret.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path('deploy/interna/ferret/compose.yml')
          b=path.read_bytes()
          h=hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()
          assert h=='9f4e17461d2179607343780fed922153050f1e86',h
          data=Path('ops/pa07/ce_ga06_align01.py').read_text()
          assert '7739a2d381f68ddb38eb9dc4e72740df364f74ff' in data
          assert 'FERRET_V5_NAO_ESTA_ATIVO' in data
          print('GA06_LAUNCHERS_STATIC=PASS')
          PY
