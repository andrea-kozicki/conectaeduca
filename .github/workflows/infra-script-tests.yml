name: Infrastructure Script Tests

on:
  pull_request:
    paths:
      - "scripts/implantacao/pfsense/**"
      - "deploy/interna/bacula/preparar_storage_emulado.py"
      - ".github/workflows/infra-script-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/implantacao/pfsense/**"
      - "deploy/interna/bacula/preparar_storage_emulado.py"
      - ".github/workflows/infra-script-tests.yml"

permissions:
  contents: read

jobs:
  script-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: POSIX shell syntax — pfSense
        run: |
          sh -n scripts/implantacao/pfsense/40-checkpoint-logging.sh
          sh -n scripts/implantacao/pfsense/90-coletar-evidencias.sh

      - name: Self-test — logging pfSense
        run: |
          sh scripts/implantacao/pfsense/40-checkpoint-logging.sh --self-test

      - name: Self-test — coletor pfSense
        run: |
          sh scripts/implantacao/pfsense/90-coletar-evidencias.sh --self-test

      - name: Python syntax — Bacula storage helper
        run: |
          python3 -m py_compile deploy/interna/bacula/preparar_storage_emulado.py

      - name: Reject root before persistent artifacts — Bacula storage helper
        shell: bash
        run: |
          set -euo pipefail
          helper="deploy/interna/bacula/preparar_storage_emulado.py"
          lock_dir="/run/lock/conectaeduca-bacula"
          lock="$lock_dir/storage-emulado.lock"
          evidence="${RUNNER_TEMP}/bacula-root-reject-evidence"

          sudo rm -rf "$lock_dir"
          rm -rf "$evidence"

          set +e
          sudo python3 "$helper" check --evidence-dir "$evidence"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "ERRO: helper aceitou execução como root" >&2
            exit 1
          fi

          if [ -e "$lock_dir" ] || [ -e "$lock" ]; then
            echo "ERRO: execução root criou namespace/lock persistente" >&2
            ls -ld "$lock_dir" "$lock" >&2 2>/dev/null || true
            exit 1
          fi

          if [ -e "$evidence" ]; then
            echo "ERRO: execução root criou evidence-dir antes da rejeição" >&2
            find "$evidence" -maxdepth 2 -ls >&2 || true
            exit 1
          fi

          echo "SELF_TEST_BACULA_ROOT_REJECT=APROVADO"

      - name: Stable-descriptor contract — Bacula lock namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("deploy/interna/bacula/preparar_storage_emulado.py").read_text(
              encoding="utf-8"
          )
          start = source.index('LOCK_NAMESPACE_HELPER = r"""')
          end = source.index('"""', start + len('LOCK_NAMESPACE_HELPER = r"""'))
          helper = source[start:end]

          required = [
              "os.O_DIRECTORY",
              "os.O_NOFOLLOW",
              "dir_fd=root_fd",
              "os.fchown(dir_fd, 0, 0)",
              "os.fchmod(dir_fd, 0o755)",
              "dir_fd=dir_fd",
              "st_dev",
              "st_ino",
          ]
          missing = [token for token in required if token not in helper]
          if missing:
              raise SystemExit(
                  "contrato de descritor estável ausente: " + ", ".join(missing)
              )

          forbidden = [
              "os.chown(directory",
              "os.chmod(directory",
          ]
          present = [token for token in forbidden if token in helper]
          if present:
              raise SystemExit(
                  "normalização por pathname reapareceu: " + ", ".join(present)
              )

          print("SELF_TEST_BACULA_LOCK_STABLE_DESCRIPTOR=APROVADO")
          PY

      - name: Restrictive umask — Bacula lock namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /run/lock/conectaeduca-bacula

          python3 - <<'PY'
          import importlib.util
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path

          path = Path("deploy/interna/bacula/preparar_storage_emulado.py")
          spec = importlib.util.spec_from_file_location("bacula_storage_umask", path)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          cmd = [
              "sudo",
              "bash",
              "-c",
              'umask 077; exec python3 - "$@"',
              "bash",
              str(mod.HOST_LOCK_ROOT),
              str(mod.HOST_LOCK_DIR),
              str(mod.HOST_LOCK_PATH),
          ]
          proc = subprocess.run(
              cmd,
              input=mod.LOCK_NAMESPACE_HELPER,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              check=False,
              timeout=30,
          )
          if proc.returncode != 0:
              raise SystemExit(
                  f"helper de namespace falhou sob umask 077: "
                  f"rc={proc.returncode} output={proc.stdout!r}"
              )

          dir_st = os.lstat(mod.HOST_LOCK_DIR)
          lock_st = os.lstat(mod.HOST_LOCK_PATH)

          if (
              dir_st.st_uid != 0
              or dir_st.st_gid != 0
              or stat.S_IMODE(dir_st.st_mode) != 0o755
          ):
              raise SystemExit(
                  "umask 077 alterou o contrato do namespace: "
                  f"uid={dir_st.st_uid} gid={dir_st.st_gid} "
                  f"mode={oct(stat.S_IMODE(dir_st.st_mode))}"
              )

          if (
              lock_st.st_uid != 0
              or lock_st.st_gid != 0
              or stat.S_IMODE(lock_st.st_mode) != 0o444
          ):
              raise SystemExit(
                  "umask 077 alterou o contrato do lock: "
                  f"uid={lock_st.st_uid} gid={lock_st.st_gid} "
                  f"mode={oct(stat.S_IMODE(lock_st.st_mode))}"
              )

          # A validação normal do helper deve aceitar o namespace criado sob
          # umask restritivo sem qualquer reparo adicional.
          if not mod.validate_host_lock_namespace():
              raise SystemExit("namespace criado sob umask 077 não foi aceito")

          print("SELF_TEST_BACULA_LOCK_UMASK_077=APROVADO")
          PY

      - name: Concurrency lock — Bacula storage helper
        run: |
          python3 - <<'PY'
          import importlib.util
          import subprocess
          import sys
          from pathlib import Path

          path = Path("deploy/interna/bacula/preparar_storage_emulado.py")
          spec = importlib.util.spec_from_file_location("bacula_storage_helper", path)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          child = r'''
          import importlib.util
          import sys
          from pathlib import Path

          path = Path("deploy/interna/bacula/preparar_storage_emulado.py")
          spec = importlib.util.spec_from_file_location("bacula_storage_helper_child", path)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          try:
              with mod.host_migration_lock("ci-child"):
                  pass
          except RuntimeError as exc:
              if "concorrente foi recusado" in str(exc):
                  raise SystemExit(23)
              raise
          raise SystemExit(0)
          '''

          with mod.host_migration_lock("ci-parent"):
              blocked = subprocess.run([sys.executable, "-c", child], check=False)
              if blocked.returncode != 23:
                  raise SystemExit(
                      f"lock concorrente não foi recusado: rc={blocked.returncode}"
                  )

          released = subprocess.run([sys.executable, "-c", child], check=False)
          if released.returncode != 0:
              raise SystemExit(
                  f"lock não foi liberado após saída do holder: rc={released.returncode}"
              )

          print("SELF_TEST_BACULA_HOST_LOCK=APROVADO")
          PY

      - name: Multi-operator lock — Bacula storage helper
        shell: bash
        run: |
          set -euo pipefail

          helper_tmp="/tmp/conectaeduca-bacula-storage-helper-ci.py"
          ready_tmp="/tmp/conectaeduca-bacula-lock-ready"
          release_tmp="/tmp/conectaeduca-bacula-lock-release"
          user_a="ce-lock-a"
          user_b="ce-lock-b"

          cleanup() {
            sudo userdel "$user_a" >/dev/null 2>&1 || true
            sudo userdel "$user_b" >/dev/null 2>&1 || true
            sudo rm -f "$helper_tmp" "$ready_tmp" "$release_tmp"
          }
          trap cleanup EXIT

          cp deploy/interna/bacula/preparar_storage_emulado.py "$helper_tmp"
          chmod 0644 "$helper_tmp"

          sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$user_a"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$user_b"

          HELPER_TMP="$helper_tmp" READY_TMP="$ready_tmp" RELEASE_TMP="$release_tmp" USER_A="$user_a" USER_B="$user_b" python3 - <<'PY'
          import importlib.util
          import os
          import stat
          import subprocess
          import sys
          import time
          from pathlib import Path

          helper = Path(os.environ["HELPER_TMP"])
          ready_path = Path(os.environ["READY_TMP"])
          release_path = Path(os.environ["RELEASE_TMP"])
          user_a = os.environ["USER_A"]
          user_b = os.environ["USER_B"]

          spec = importlib.util.spec_from_file_location("bacula_storage_multiop", helper)
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          # Prepara o namespace uma vez como o operador do runner, que possui
          # sudo não-interativo. Depois disso os dois usuários de teste não
          # precisam de sudo: apenas abrem o lock root-owned em modo read-only.
          with mod.host_migration_lock("ci-bootstrap"):
              pass

          dir_st = os.lstat(mod.HOST_LOCK_DIR)
          lock_st = os.lstat(mod.HOST_LOCK_PATH)
          if (
              dir_st.st_uid != 0
              or dir_st.st_gid != 0
              or stat.S_IMODE(dir_st.st_mode) != 0o755
          ):
              raise SystemExit("namespace do lock não é root:root 0755")
          if (
              lock_st.st_uid != 0
              or lock_st.st_gid != 0
              or stat.S_IMODE(lock_st.st_mode) != 0o444
          ):
              raise SystemExit("lock não é root:root 0444")

          child = r'''
          import importlib.util
          import sys
          import time
          from pathlib import Path

          helper = Path(sys.argv[1])
          action = sys.argv[2]

          spec = importlib.util.spec_from_file_location(
              "bacula_storage_multiop_child", helper
          )
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          if action == "hold":
              ready_path = Path(sys.argv[3])
              release_path = Path(sys.argv[4])
              with mod.host_migration_lock("ci-user-a"):
                  ready_path.write_text("READY\n", encoding="utf-8")
                  deadline = time.monotonic() + 10
                  while not release_path.exists() and time.monotonic() < deadline:
                      time.sleep(0.05)
                  if not release_path.exists():
                      raise SystemExit(98)
              raise SystemExit(0)

          if action == "try":
              try:
                  with mod.host_migration_lock("ci-user-b"):
                      pass
              except RuntimeError as exc:
                  if "concorrente foi recusado" in str(exc):
                      raise SystemExit(23)
                  raise
              raise SystemExit(0)

          raise SystemExit(99)
          '''

          holder = subprocess.Popen(
              [
                  "sudo",
                  "-u",
                  user_a,
                  "--",
                  sys.executable,
                  "-c",
                  child,
                  str(helper),
                  "hold",
                  str(ready_path),
                  str(release_path),
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
          )
          deadline = time.monotonic() + 10
          while not ready_path.exists() and time.monotonic() < deadline:
              if holder.poll() is not None:
                  output = holder.communicate(timeout=5)[0]
                  raise SystemExit(
                      f"operador A encerrou antes de adquirir o lock: "
                      f"rc={holder.returncode} output={output!r}"
                  )
              time.sleep(0.05)

          if not ready_path.exists():
              holder.kill()
              output = holder.communicate(timeout=5)[0]
              raise SystemExit(
                  f"operador A não sinalizou aquisição do lock: output={output!r}"
              )

          blocked = subprocess.run(
              ["sudo", "-u", user_b, "--", sys.executable, "-c", child, str(helper), "try"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              timeout=10,
          )
          if blocked.returncode != 23:
              holder.kill()
              raise SystemExit(
                  "operador B não foi bloqueado enquanto A segurava o lock: "
                  f"rc={blocked.returncode} output={blocked.stdout!r}"
              )

          release_path.write_text("RELEASE\n", encoding="utf-8")
          holder.wait(timeout=10)
          if holder.returncode != 0:
              output = holder.stdout.read() if holder.stdout is not None else ""
              raise SystemExit(
                  f"operador A encerrou com rc={holder.returncode} output={output!r}"
              )

          released = subprocess.run(
              ["sudo", "-u", user_b, "--", sys.executable, "-c", child, str(helper), "try"],
              check=False,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              timeout=10,
          )
          if released.returncode != 0:
              raise SystemExit(
                  "operador B não reutilizou o lock após liberação: "
                  f"rc={released.returncode} output={released.stdout!r}"
              )

          print("SELF_TEST_BACULA_MULTI_OPERATOR_LOCK=APROVADO")
          PY