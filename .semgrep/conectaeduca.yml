rules:
  - id: conectaeduca.python.subprocess-shell-true
    languages:
      - python
    severity: ERROR
    message: >
      Evite subprocess com shell=True. Prefira argumentos em lista e
      execução direta para reduzir risco de command injection.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: conectaeduca.python.eval-exec
    languages:
      - python
    severity: ERROR
    message: >
      Não execute conteúdo dinâmico com eval/exec.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: conectaeduca.php.eval
    languages:
      - php
    severity: ERROR
    message: >
      Não execute conteúdo dinâmico com eval.
    pattern: eval(...);

  - id: conectaeduca.php.raw-exception-output
    languages:
      - php
    severity: ERROR
    message: >
      Não exponha getMessage() diretamente na saída; registre informação
      controlada e apresente mensagem genérica ao usuário.
    pattern-either:
      - pattern: echo $E->getMessage();
      - pattern: printf(..., $E->getMessage(), ...);
      - pattern: info($E->getMessage());
      - pattern: failure($E->getMessage());
