name: conectaeduca-mailpit-lab

services:
  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    container_name: conectaeduca-mailpit-lab
    platform: linux/amd64
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "50"
      MP_DISABLE_VERSION_CHECK: "true"
    tmpfs:
      - /data:size=64m,mode=700,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777,uid=10001,gid=10001
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    restart: "no"
