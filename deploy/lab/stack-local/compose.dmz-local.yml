services:
  php:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${CONECTAEDUCA_APP_URL:-https://conectaeduca.local:18444}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "${CONECTAEDUCA_STACK_SECRET_GID:?defina CONECTAEDUCA_STACK_SECRET_GID}"

  waf:
    group_add:
      - "${CONECTAEDUCA_STACK_SECRET_GID:?defina CONECTAEDUCA_STACK_SECRET_GID}"
