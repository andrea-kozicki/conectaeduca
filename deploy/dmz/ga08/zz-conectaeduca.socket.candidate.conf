[www]
listen = /run/conectaeduca-fpm/php-fpm.sock
; Non-root FPM must not attempt chown() on the socket.
; Socket owner/group inherit effective UID/GID 82:82.
listen.mode = 0660
clear_env = no
ping.path = /fpm-ping
ping.response = pong
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
catch_workers_output = yes
decorate_workers_output = no
