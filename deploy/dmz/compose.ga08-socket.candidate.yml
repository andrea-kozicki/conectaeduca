# GA-08: candidato de isolamento real; NÃO aplicar sem pré-requisitos.
# Requer diretório host previamente provisionado e validado (UID 82, GID 101,
# modo 2770); não cria diretório nem altera permissões.
services:
  waf:
    networks: !override
      - waf_backend
  nginx:
    networks: !override
      - waf_backend
    volumes:
      - type: bind
        source: ${CONECTAEDUCA_GA08_SOCKET_DIR:?defina CONECTAEDUCA_GA08_SOCKET_DIR}
        target: /run/conectaeduca-fpm
      - type: bind
        source: ${CONECTAEDUCA_GA08_NGINX_CONF:?defina CONECTAEDUCA_GA08_NGINX_CONF}
        target: /etc/nginx/conf.d/default.conf
        read_only: true
  php:
    networks: !override
      - php_egress
    volumes:
      - type: bind
        source: ${CONECTAEDUCA_GA08_SOCKET_DIR:?defina CONECTAEDUCA_GA08_SOCKET_DIR}
        target: /run/conectaeduca-fpm
      - type: bind
        source: ${CONECTAEDUCA_GA08_FPM_CONF:?defina CONECTAEDUCA_GA08_FPM_CONF}
        target: /usr/local/etc/php-fpm.d/zz-conectaeduca.conf
        read_only: true
networks:
  waf_backend:
    driver: bridge
  php_egress:
    driver: bridge
