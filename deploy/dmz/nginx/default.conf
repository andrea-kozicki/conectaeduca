server {
    listen 8080;
    server_name _;

    root /var/www/conectaeduca/public;
    index index.php;

    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /_container_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_fpm_ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass php:9000;
    }

    location /assets/ {
        try_files $uri =404;
        location ~* \.(?:php|phtml|phar|cgi|pl|py|sh)$ {
            deny all;
        }
    }

    location = /api/public_key.php {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_pass php:9000;
    }

    location = /api/processa_cadastro_usuario.php {
        limit_except POST OPTIONS {
            deny all;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_pass php:9000;
    }

    location = /api/relatorios.php {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_pass php:9000;
    }

    location ~ ^/api/(?:inscricoes|oportunidades)\.php$ {
        limit_except GET POST HEAD OPTIONS {
            deny all;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_pass php:9000;
    }

    # Defesa em profundidade: mesmo que diretórios privados sejam copiados
    # acidentalmente para a imagem do Nginx, eles não ficam acessíveis via HTTP.
    location ~ ^/(?:bootstrap|src|storage|sql|vendor)(?:/|$) {
        return 404;
    }

    location ~ ^/(?:composer\.(?:json|lock)|Makefile|phpunit\.xml(?:\.dist)?)$ {
        return 404;
    }

    location ~ \.php$ {
        # Não encaminha para o PHP-FPM um script que não exista na raiz pública.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_pass php:9000;
    }

    location / {
        # O ConectaEduca usa endpoints físicos (.php), não um front controller.
        # URLs inexistentes devem ser 404, não cair silenciosamente em index.php.
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
