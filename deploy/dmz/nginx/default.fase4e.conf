server {
    listen 8080 ssl;
    server_name conectaeduca.local localhost;

    root /var/www/conectaeduca/public;
    index index.php;

    server_tokens off;
    autoindex off;

    ssl_certificate /run/secrets/conectaeduca_tls_cert;
    ssl_certificate_key /run/secrets/conectaeduca_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /_container_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_fpm_ping {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php:9000;
    }

    location /assets/ {
        try_files $uri =404;

        location ~* \.(?:php|phtml|phar|cgi|pl|py|sh)$ {
            deny all;
        }
    }

    location ~ ^/(?:bootstrap|src|storage|sql|vendor)(?:/|$) {
        return 404;
    }

    location ~ ^/(?:composer\.(?:json|lock)|Makefile|phpunit\.xml(?:\.dist)?)$ {
        return 404;
    }

    location = /api/public_key.php {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php:9000;
    }

    location = /api/processa_cadastro_usuario.php {
        limit_except POST OPTIONS {
            deny all;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php:9000;
    }

    location = /api/relatorios.php {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php:9000;
    }

    location ~ ^/api/(?:inscricoes|oportunidades)\.php$ {
        limit_except GET POST HEAD OPTIONS {
            deny all;
        }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/conectaeduca/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/conectaeduca/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php:9000;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
