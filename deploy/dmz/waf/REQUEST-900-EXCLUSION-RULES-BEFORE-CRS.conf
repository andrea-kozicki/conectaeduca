# ConectaEduca — exclusões request-side antes do OWASP CRS
#
# Começamos propositalmente SEM exclusões.
#
# Uma regra só deve ser adicionada aqui depois que:
# 1. uma transação legítima e reproduzível acionar uma regra CRS;
# 2. o rule ID e o campo/rota forem identificados;
# 3. a exclusão puder ser limitada ao menor escopo possível.
#
# Não desabilitar famílias inteiras de regras nem o CRS para uma rota
# sem evidência técnica específica.
