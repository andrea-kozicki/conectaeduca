# ConectaEduca - exclusões CRS específicas da aplicação
#
# Evidência que motivou esta regra:
# CRS 4.25.1 / PL2, regra 942120, interpretou o padding "==" de Base64
# do AES-GCM tag como operador SQL no envelope criptográfico.
#
# A aplicação valida e autentica criptograficamente estes campos após o WAF.
# São componentes opacos (Base64), não plaintext fornecido pelo usuário.
#
# Escopo propositalmente mínimo:
# - somente o endpoint público de cadastro;
# - somente a regra 942120;
# - somente os quatro campos binários/Base64 do envelope híbrido.
#
# Demais regras CRS, demais argumentos e demais endpoints permanecem intactos.

SecRule REQUEST_URI "@streq /api/processa_cadastro_usuario.php" \
    "id:1001001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=942120;ARGS:json.encrypted_key,\
    ctl:ruleRemoveTargetById=942120;ARGS:json.iv,\
    ctl:ruleRemoveTargetById=942120;ARGS:json.tag,\
    ctl:ruleRemoveTargetById=942120;ARGS:json.ciphertext"

# Login: a senha é um valor opaco consumido exclusivamente por password_verify().
# Em 14/09/2026, CRS 4.25.1 / PL2, regra 932240, classificou uma senha legítima
# como tentativa de evasão de command injection, elevou o anomaly score a 8
# e bloqueou /login.php com HTTP 403 antes de a aplicação receber a requisição.
#
# A exclusão abaixo é deliberadamente estreita:
# - somente /login.php;
# - somente a regra 932240;
# - somente o argumento senha.
#
# A regra 932240 continua ativa para todos os demais argumentos/endpoints.
# Isso também evita que um match dessa regra registre conteúdo da senha na
# mensagem de auditoria do ModSecurity.

SecRule REQUEST_URI "@streq /login.php" \
    "id:1001002,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetById=932240;ARGS:senha"
