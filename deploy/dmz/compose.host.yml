services:
  # Adaptador de implantação para a VM da DMZ.
  # Substitui os bindings de laboratório do WAF sem alterar a imagem.
  waf:
    ports: !override
      - "${CONECTAEDUCA_WAF_BIND_ADDRESS:?defina CONECTAEDUCA_WAF_BIND_ADDRESS}:${CONECTAEDUCA_HTTP_PORT:-80}:8080"
      - "${CONECTAEDUCA_WAF_BIND_ADDRESS:?defina CONECTAEDUCA_WAF_BIND_ADDRESS}:${CONECTAEDUCA_HTTPS_PORT:-443}:8443"

  # Em duas VMs, DB_HOST/DB_PORT precisam representar um endpoint TCP real
  # da VM interna, e nunca um nome DNS de serviço Docker de outro host.
  php:
    environment:
      DB_HOST: "${CONECTAEDUCA_DB_HOST:?defina CONECTAEDUCA_DB_HOST}"
      DB_PORT: "${CONECTAEDUCA_DB_PORT:-3306}"
