# ConectaEduca - overlay final de implantação da VM DMZ.
services:
  php:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${CONECTAEDUCA_APP_URL:?defina CONECTAEDUCA_APP_URL}"
    group_add:
      - "${CONECTAEDUCA_STACK_SECRET_GID:?defina CONECTAEDUCA_STACK_SECRET_GID}"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=82,gid=82,mode=1770
      - /var/www/conectaeduca/storage/logs:rw,nosuid,nodev,noexec,size=32m,uid=82,gid=82,mode=0770
      - /var/www/conectaeduca/storage/keys:rw,nosuid,nodev,noexec,size=4m,uid=82,gid=82,mode=0770


  nginx:
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0750
      - /var/run:rw,nosuid,nodev,noexec,size=4m,uid=101,gid=101,mode=0750

  waf:
    group_add:
      - "${CONECTAEDUCA_STACK_SECRET_GID:?defina CONECTAEDUCA_STACK_SECRET_GID}"

    # A imagem upstream gera configuração Nginx/ModSecurity dinamicamente no
    # entrypoint. A derivação ConectaEduca guarda a baseline dentro da imagem e
    # a rematerializa somente nestas áreas efêmeras durante cada inicialização.
    read_only: true
    tmpfs:
      - /etc/nginx:rw,nosuid,nodev,noexec,size=32m,uid=101,gid=101,mode=0750
      - /etc/modsecurity.d:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0750
      - /opt/owasp-crs:rw,nosuid,nodev,noexec,size=32m,uid=101,gid=101,mode=0750
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0750
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=101,gid=101,mode=1770
    cap_drop:
      - ALL
    pids_limit: 128
