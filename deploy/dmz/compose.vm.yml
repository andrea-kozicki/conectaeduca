# ConectaEduca - overlay final de implantação da VM DMZ.
services:
  php:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${CONECTAEDUCA_APP_URL:?defina CONECTAEDUCA_APP_URL}"
    group_add:
      - "${CONECTAEDUCA_STACK_SECRET_GID:?defina CONECTAEDUCA_STACK_SECRET_GID}"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=82,gid=82,mode=1770
      - /var/www/conectaeduca/storage/logs:rw,nosuid,nodev,noexec,size=32m,uid=82,gid=82,mode=0770
      - /var/www/conectaeduca/storage/keys:rw,nosuid,nodev,noexec,size=4m,uid=82,gid=82,mode=0770


  nginx:
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,uid=101,gid=101,mode=0750
      - /var/run:rw,nosuid,nodev,noexec,size=4m,uid=101,gid=101,mode=0750

  waf:
    group_add:
      - "${CONECTAEDUCA_STACK_SECRET_GID:?defina CONECTAEDUCA_STACK_SECRET_GID}"
    # Hardening compatível com a imagem WAF atual:
    # - o serviço já executa como usuário nginx e possui no-new-privileges;
    # - não precisa de capabilities Linux adicionais nos listeners 8080/8443;
    # - o limite de PIDs reduz impacto de fork/process exhaustion.
    #
    # read_only NÃO é forçado neste overlay enquanto a imagem customizada
    # continuar derivada da variante writable do OWASP CRS. A promoção para
    # variante read-only será tratada separadamente e validada em candidato.
    cap_drop:
      - ALL
    pids_limit: 128
