services:
  # Na presença deste overlay, o Nginx deixa de publicar 8088 no host.
  # Ele continua ouvindo em 8080 apenas dentro da rede Docker frontend.
  nginx:
    ports: !reset []
    expose:
      - "8080"

  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    image: conectaeduca/waf:dmz
    restart: unless-stopped

    # Telemetria defensiva: o Wazuh Agent nativo da EP125 já coleta journald.
    # Mantemos o audit log do ModSecurity em stdout e mudamos apenas o driver
    # do container WAF para uma origem estável, evitando depender de IDs
    # dinâmicos em /var/lib/docker/containers/<id>/<id>-json.log.
    logging:
      driver: journald
      options:
        tag: "conectaeduca-waf"

    security_opt:
      - no-new-privileges:true
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      BACKEND: "http://nginx:8080"
      SERVER_NAME: "conectaeduca.local"
      PORT: "8080"

      MODSEC_RULE_ENGINE: "On"
      MODSEC_STATUS_ENGINE: "Off"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"

      # A = cabeçalho da auditoria
      # F = cabeçalhos finais de resposta
      # H = trailer/mensagens das regras
      # Z = terminador
      #
      # B (request headers) e C (request body) permanecem omitidos para reduzir
      # persistência desnecessária de cookies, tokens e conteúdo de formulários.
      MODSEC_AUDIT_LOG_PARTS: "AFHZ"

      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      REPORTING_LEVEL: "2"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"

      SERVER_TOKENS: "off"
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - frontend
