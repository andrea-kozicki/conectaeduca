services:
  wazuh.indexer:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fksS --connect-timeout 4 --max-time 8
          https://localhost:9200/_plugins/_security/health
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  wazuh.dashboard:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          code=$$(curl -ksS --connect-timeout 4 --max-time 8
          -o /dev/null -w '%{http_code}'
          https://localhost:5601/login);
          case "$$code" in
            200|301|302|401|403) exit 0 ;;
            *) exit 1 ;;
          esac
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
