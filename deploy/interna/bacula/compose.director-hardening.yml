services:
  director:
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
      - /run/bacula:rw,nosuid,nodev,noexec,size=16m
      - /var/lib/bacula:rw,nosuid,nodev,noexec,size=32m
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        chmod 1777 /tmp
        chmod 0750 /run/bacula
        chmod 0700 /var/lib/bacula
        chown 100:101 /run/bacula /var/lib/bacula
        exec bacula-dir -P -f -u bacula -g bacula -c /etc/bacula-runtime/bacula-dir.conf
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(cat /proc/1/comm)" = "bacula-dir"'
      interval: 15s
      timeout: 3s
      retries: 6
      start_period: 10s
