# ConectaEduca GUI-01B — API read-only method firewall
# POST/PUT/PATCH/DELETE sob /api são bloqueados antes do PHP.
# POST da aplicação Web fora de /api permanece disponível.
map "$request_method:$request_uri" $ce_api_mutation_block {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):/(?:index\.php/)?api(?:/|$) 1;
}
