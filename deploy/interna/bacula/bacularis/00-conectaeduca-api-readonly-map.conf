# ConectaEduca GUI-01B — API read-only method firewall
# A decisão usa $uri, que é normalizada pelo Nginx.
# Dentro de /api e /index.php/api, somente GET/HEAD são permitidos.
# POST da aplicação Web fora de /api permanece disponível.

map $request_method $ce_api_method_allowed {
    default 0;
    GET 1;
    HEAD 1;
}

map $uri $ce_api_path {
    default 0;
    ~^/(?:index\.php/)?api(?:/|$) 1;
}

map "$ce_api_path:$ce_api_method_allowed" $ce_api_mutation_block {
    default 0;
    "1:0" 1;
}
