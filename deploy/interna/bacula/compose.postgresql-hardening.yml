services:
  catalog:
    # no-new-privileges já é declarado em compose.vm.yml.
    # Não repetir security_opt aqui: Docker Compose mescla sequências e
    # rejeita itens duplicados durante "docker compose config".
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=3775,size=16m
    volumes:
      - ./postgresql/99-conectaeduca-hardening.sh:/docker-entrypoint-initdb.d/99-conectaeduca-hardening.sh:ro
