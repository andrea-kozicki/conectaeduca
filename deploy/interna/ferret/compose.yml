name: conectaeduca-ferret

services:
  ferret:
    image: localhost/conectaeduca/ferret-scan:2.4.3-pa07-v5-candidate
    pull_policy: never
    restart: unless-stopped
    command:
      - --web
      - --port
      - "8080"
      - --config
      - /etc/ferret/ferret.yaml
      - --suppression-file
      - /var/lib/ferret/suppressions.yaml
    ports:
      - "${FERRET_BIND_ADDRESS:-127.0.0.1}:${FERRET_WEB_PORT:-18082}:8080"
    volumes:
      - ./config/ferret.yaml:/etc/ferret/ferret.yaml:ro
      - ./.runtime/state:/var/lib/ferret
      - ./.runtime/inbox:/data/inbox:ro
      - ./.runtime/reports:/data/reports
    tmpfs:
      - /home/ferret/tmp:rw,nosuid,nodev,noexec,size=256m,uid=1000,gid=1000,mode=0700
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "1280m"
    cpus: "2.00"
    stop_grace_period: 10s
    networks:
      - ferret-backend

networks:
  ferret-backend:
    driver: bridge
