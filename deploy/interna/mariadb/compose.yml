name: conectaeduca-mariadb

services:
  mariadb:
    image: mariadb:12.3.2-ubi10@sha256:e45834e9fd4a51f92f746fcfd549ff507d55cf58e3c34b8c2fd4af3439fc506d
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: conectaeduca
      MARIADB_USER: conectaeduca_app
      # O default da imagem oficial é root@'%'. Em novos volumes, restringir root
      # a localhost. Volumes já existentes exigem reconciliação SQL explícita.
      MARIADB_ROOT_HOST: localhost
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/conectaeduca_db_password
    secrets:
      - mariadb_root_password
      - conectaeduca_db_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../../../sql/conectaeduca.sql:/docker-entrypoint-initdb.d/10-conectaeduca.sql:ro
      - ./20-minimos-privilegios.sql:/docker-entrypoint-initdb.d/20-minimos-privilegios.sql:ro
      - ./conectaeduca.cnf:/etc/mysql/conf.d/zz-conectaeduca.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - backend

secrets:
  mariadb_root_password:
    file: ${CONECTAEDUCA_DB_ROOT_PASSWORD_FILE:?defina CONECTAEDUCA_DB_ROOT_PASSWORD_FILE}
  conectaeduca_db_password:
    file: ${CONECTAEDUCA_DB_PASSWORD_FILE:?defina CONECTAEDUCA_DB_PASSWORD_FILE}

volumes:
  mariadb_data:

networks:
  backend:
    driver: bridge
