services:
  mariadb:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /run/mariadb:rw,nosuid,nodev,noexec,uid=999,gid=999,mode=0755,size=16m
