name: conectaeduca-twingate-dmz

services:
  connector:
    image: twingate/connector:1
    container_name: conectaeduca-dmz-01
    restart: unless-stopped
    env_file:
      - ./connector.env
    environment:
      TWINGATE_LABEL_HOSTNAME: ep125-pucpr
      TWINGATE_LABEL_DEPLOYED_BY: docker
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    security_opt:
      - no-new-privileges:true
    # Sem portas publicadas, privileged ou docker.sock.
    networks:
      - connector-egress

networks:
  connector-egress:
    driver: bridge
