<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ConectaEduca — portfólio de Segurança da Informação</title>
  <desc id="desc">Banner de um projeto acadêmico individual de Andréa Kozicki sobre AppSec, Zero Trust, Blue Team e DevSecOps. À direita, blocos abstratos para DMZ e rede interna.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#101e36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29e2ce"/>
      <stop offset="1" stop-color="#74a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020817" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="5" r="315" fill="#183456" opacity=".44"/>
  <circle cx="795" cy="665" r="260" fill="#172d48" opacity=".7"/>
  <path d="M88 115h102" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <text x="88" y="91" fill="#75b5c9" font-size="21" font-family="DejaVu Sans, sans-serif" font-weight="700" letter-spacing="2">PORTFÓLIO · SEGURANÇA DA INFORMAÇÃO</text>
  <text x="84" y="230" fill="#f5fbff" font-size="76" font-family="DejaVu Sans, sans-serif" font-weight="700">ConectaEduca</text>
  <text x="88" y="291" fill="#b8cbdd" font-size="27" font-family="DejaVu Sans, sans-serif">AppSec · Blue Team · Zero Trust · DevSecOps</text>
  <text x="88" y="362" fill="#e3edf8" font-size="23" font-family="DejaVu Sans, sans-serif">Duas redes. Dois pentests. Evidências verificáveis.</text>
  <rect x="88" y="431" width="535" height="75" rx="18" fill="#1a3952" stroke="#2f6573"/>
  <circle cx="126" cy="469" r="11" fill="#30dfc1"/>
  <text x="156" y="477" fill="#f0f9fc" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="600">Projeto individual · Andréa Kozicki</text>
  <text x="88" y="571" fill="#859db7" font-size="17" font-family="DejaVu Sans, sans-serif">Laboratório acadêmico · 2026 · Resultados e limites documentados</text>
  <g filter="url(#shadow)" font-family="DejaVu Sans, sans-serif">
    <rect x="758" y="141" width="405" height="139" rx="20" fill="#153b4c" stroke="#30cfc0" stroke-width="2"/>
    <text x="791" y="186" fill="#80f3d7" font-size="22" font-weight="700">EP125 · DMZ</text>
    <text x="791" y="231" fill="#eef9ff" font-size="27" font-weight="600">WAF → Nginx → PHP</text>
    <rect x="758" y="362" width="405" height="139" rx="20" fill="#223552" stroke="#7c9de9" stroke-width="2"/>
    <text x="791" y="406" fill="#aac7ff" font-size="22" font-weight="700">EP126 · REDE INTERNA</text>
    <text x="791" y="450" fill="#eef9ff" font-size="25" font-weight="600">Wazuh · Ferret · Bacula</text>
  </g>
  <path d="M960 282v75" fill="none" stroke="#b6d4f5" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="893" y="300" width="136" height="43" rx="21" fill="#101e36" stroke="#6c94ba"/>
  <text x="961" y="329" text-anchor="middle" fill="#d2e3f0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">pfSense</text>
  <path d="M690 91v481" stroke="#2a4665" stroke-width="2"/>
</svg>
